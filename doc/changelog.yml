    api: stable
  date: 2011-08-31
  license:
    identifier: GPL-2.0
    uri: http://www.horde.org/licenses/gpl
  notes: "[mms] Automatically track rownumber updates when selecting messages; fixes SHIFT-DEL behavior in the dynamic view.\n[mms] Fix contents of sent message when directly sending from spellcheck in standard view (Bug #10464).\n[mms] Fix namespace auto-detection for non-sane namespace configs (Bug #10447).\n[mms] Fix POP3 regression (Bug #10450).\n[mms] Forwarded messages no longer treated as an attachment in the UI (Request #9754).\n[mms] Correctly display submailboxes in dynamic view when new submailbox is created before parent mailbox is expanded (Bug #10429).\n"
