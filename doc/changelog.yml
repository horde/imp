    uri: http://www.horde.org/licenses/gpl
  notes: "[mms] Add Save All link to the popup message page in dynamic view.\n[jan] Update Danish translation (Erling Preben Hansen <erling@eph.dk>).\n[mms] Cleaner handling of broken S/MIME signed messages.\n[mms] Fix displaying user-defined message headers when multiple-headers exist in a single message.\n[mjr] Honor recurrence-id range values when deleting recurring events (Bug #12746).\n[mms] Don't provide links to view attachments in compose screen unless the attachment can be displayed (Bug #12841).\n"
6.1.6:
