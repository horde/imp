7.0.0-alpha1:
  api: 7.0.0alpha1
  state:
    release: beta
    api: beta
  date: 2021-02-24
  license:
    identifier: GPL-2.0
    uri: http://www.horde.org/licenses/gpl
  notes: "Original version string was 7.0.0alpha1\n[jan] Sort public keys in preferences by name.\n[jan] Allow to specify a secondary S/MIME certificate for signatures only.\n[jan] Find logged replies in other than default sent-mail folders too.\n[mjr] Fix SyntaxHighlighter MIME viewer not rendering part after the initial view of a part (Bug 14337).\n[mjr] Display comment attribute in iTip viewer (Request #14407).\n[mjr] Update the user/attendee participation status when accepting/importing an iTip.\n[jan] Allow to import multiple PGP keys in a single PGP packet (Request #13190).\n[jan] Add Alt+Home and Alt+End hotkeys to navigate in preview pane (michael.menge@zdv.uni-tuebingen.de, Request #13983).\n[mjr] Add support for sending MDN via the API.\n[mjr] Add imap_preauthenticate hook.\n[mms] Report multiple spam/innocent messages in a single digest.\n[mms] Remove mailbox from polled list when unsubscribing from it.\n[mms] Allow remote account passwords to be saved encrypted in user's preferences (Request #13168).\n[mms] Send IMP MUA information to IMAP servers that support the ID extension.\n[mms] Send S/MIME encrypted data to multiple recipients in a single outgoing message.\n[mms] Sent-mail maillog entries are now linked to a viewable representation of the sent message, if it still exists on the server.\n[mms] Store message ID of the sent message when saving maillog history.\n[mms] Add backend configuration option to use body structure data to more accurately determine whether a message contains attachments.\n[jan] Show warning on S/MIME page if personal certificate has expired.\n[mjr] Improve support for vTodo iTip handling.\n[mms] Add resent information to message header display.\n[mms] Added an option to the mailboxList API call to force inclusion of unsubscribed mailboxes.\n[mms] Asynchronously load the mailbox list on the advanced search page.\n[mms] Automatically try to rotate embedded inline images when displaying a message.\n[mms] Add ability to add email groups to the address book.\n[mms] Improved contacts loading - all contacts are never shown by default, but provide simple method for user to load all contacts.\n[mms] Add dynamically updating relative time display for messages in dynamic view.\n[mms] Add Purge Deleted button in smartmobile view (Request #13155).\n[mms] Improved display of attachments and message log information in dynamic view.\n[mms] IMP no longer uses MDN status stored in the maillog backend by default.\n[mms] Add ability to download individual files from within a .tgz attachment.\n[mms] Improved display of contents of ZIP attachments.\n[mms] Contacts popup now does address search dynamically, without the need to reload the page.\n[mms] Remove 'mailboxarray' hook.\n[mms] Remove 'display_folder' hook.\n[mms] Auto-detect EAI support on mail backends and provide validation feedback without the need to submit to the backend.\n[mms] Removed basic view.\n[mms] Do autocomplete search on browser, if sufficient data exists, to save calls to contacts backend.\n[mms] Removed minimal view.\n[mms] Allow auto-completed e-mail groups to be expanded on the dynamic compose page.\n[mms] Add class of message part rendering display errors that aren't shown to the user by default.\n[mms] Throttle message list keypresses in dynamic view to prevent avalanche of preview requests sent to server (Request #13574).\n[mms] Filter out relative image URLs in HTML message data.\n[mms] Implement lazy loading for images in HTML messages.\n[mms] Add 'dynamic_prefs' hook to allow for changing of default values for browser-based preferences in dynamic view.\n[mms] Removed compose 'use_vfs' configuration option.\n[mjr] Add IMP_Api::addFlags().\n[mms] Allow multiple independent attachment actions on the dynamic compose screen.\n[mms] Add upload progress bar in dynamic compose screen when adding attachments.\n[mms] Uniquely identify sent-mail mailboxes by identity in main folder tree (Request #12721).\n[mms] Don't send empty text part if a message contains attachments.\n[mms] Add button to allow folder tree to be rebuilt in smartmobile view.\n[mms] Add option to poll mailbox for new mailbox when creating a mailbox (Request #13227).\n"
