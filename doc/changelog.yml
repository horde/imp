  license:
    identifier: GPL-2.0
    uri: http://www.horde.org/licenses/gpl
  notes: "[mms] Fix handling authentication errors when they take place during an attempt to determine a mailbox's namespace.\n[mms] Fix some folder display issues when not using IMAP subscriptions in dynamic view (Bug #13553).\n[mms] Fix accessing dynamic compose page when file uploads are not available (Bug #13580).\n[mms] Fix saving unique browser preferences for a specific backend in dynamic view.\n[mms] Fix toggling select all checkbox in both dynamic mailbox layouts.\n"
6.2.2:
