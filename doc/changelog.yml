  notes: "[jan] Don't focus body field when composing message with HTML editor.\n[jan] Protect against infinite request loop if expanding all mailboxes.\n[jan] Don't show ACL context menu if ACL preferences are locked.\n[jan] Fix redirecting in smartmobile mode (Bug #14002).\n[jan] Fix address autocompletion in redirection window of smartmobile mode (Bug #14002).\n[jan] Fix setting single recipients in redirection window in basic mode (Bug #14002).\n[jan] Don't switch to regular compose view after an error in the redirection view in basic mode.\n[jan] Fix cancelling redirection window in basic mode (Bug #14002).\n"
