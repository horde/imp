  date: 2011-03-16
  license:
    identifier: GPL-2.0
    uri: http://www.horde.org/licenses/gpl
  notes: "Original version string was 5.0.0beta1\n[mms] Fix purging deleted messages in dynamic view (Bug #9627).\n[mms] Fix display of non-IMAP mailbox elements in folder lists (Bug #9650).\n[mms] Fix print part display.\n[jan] Fix listing users through IMP API.\n"
5.0.0-alpha1:
  api: 5.0.0
  state:
    release: alpha
    api: alpha
  date: 2011-03-09
  license:
    identifier: GPL-2.0
    uri: http://www.horde.org/licenses/gpl
  notes: "Original version string was 5.0.0alpha1\nFirst alpha release for Horde 4.\n[jan] Add configuration whether to load other applications in an IFRAME.\n[mms] Indicate negative rights in ACL display (Request #4488).\n[jan] Provide default configuration files instead of .dist versions.\n[mms] Add priority and request read receipt information to saved drafts (Request #9457).\n[mms] Added example in pre_sent hook to do forgotten attachment checking at send time (Request #9028).\n[mms] Add subfolder searching (subfolders dynamically determined at time of search).\n[mms] Refactor inline message image blocking to operate on all messages, not just HTML messages.\n[mms] Add attachment message filter.\n[mms] Add post_spam hook called after reporting spam/ham (Request #6455).\n[mms] Implement stationery support in DIMP.\n[mms] Add preference to control displayed content for multipart/alternative parts (Request #6711).\n[mms] Allow multiple messages to be forwarded in a single outgoing message (DIMP) (Request #9132).\n[mms] Add personal recipient message filter (Request #8659).\n[mms] Add mailing list message filter (Request #8659).\n[mms] Add ability to define search criteria to be applied to any mailbox (Request #8659).\n[mms] Use recipient search (To/Cc/Bcc) by default instead of To search.\n[mms] Virtual folders now editable via a preferences group.\n[mms] Search code has been entirely rewritten.\n[jan] Rename servers.php to backends.php.\n[mms] Use alternate text part to generate reply/forward text when switching compose modes if user has not altered message text (DIMP).\n[mms] Improved login error reporting/logging in IMP (Request #9211).\n[mms] Add hook to skip MDN prompt based on content of message headers.\n[mms] Allow expand/collapse of folders in MIMP.\n[mms] Use single, unified mailbox cache.\n[mms] Add support for setting/retrieving special-use mailboxes from IMAP server.\n[mms] Add preference to control if we check for recipient PGP public keys when replying (Request #7962).\n[mms] Automatically determine view based on browser and 'dynamic_view' preference (Request #9159).\n[mms] Add preference to define default font family/size for the HTML compose editor.\n[mms] Honor nav_expanded preference (DIMP).\n[mms] Allow admin to define list of safe e-mail addresses that will not experience HTML image blocking (Request #9129).\n[mms] HTML compose editor uses Horde language for UI (Request #9084; leandro.damascena@gmail.com).\n[mms] Add config option to disable multipart/related conversions (Request #9099).\n[mms] Sentmail SQL driver now supports split read/write operation.\n[mms] Pass compose message data to mailer backend via stream; much more efficient, especially with larger messages (Request #8909).\n[mms] Add strip attachments support in DIMP.\n[mms] Add PGP & S/MIME compose support to DIMP.\n[mms] Check for incorrect identity on compose if a single recipient address is tied to a different identity than the sending identity.\n[mms] Use CATENATE (RFC 4469), if available, to strip MIME parts (Request #8092).\n[mms] Add preference to show flags created by other MUAs (Request #8882).\n[mms] Added HTML signature support (Request #1406).\n[mms] Simplified date sorting display (Request #8936).\n[mms] Properly redirect messages pursuant to RFC 5322 [3.6.6].\n[mms] Add redirect message capability to DIMP.\n[mms] Add ability to add attachments to composed messages for advanced mobile browsers - disabled by default (MIMP).\n[mms] Add checkbox interface to mailbox page for advanced mobile browsers - disabled by default (MIMP).\n[mms] Add preference to allow viewing of all inline parts by default (MIMP).\n[mms] Add hook to alter composed message details before sending.\n[mms] DIMP now honors the 'allow_resume_all' configuration option.\n[mms] Remove 'sort_limit' configuration option.\n[mms] Mobile view no longer supports WML output.\n[jan] Implement iTip viewer actions in DIMP (Request #8061).\n[mms] Display alarm notifications in DIMP (Request #6232).\n[mms] Auto-determine charset for text attachments (Bug #8858).\n[mms] Remove IE 6 (and below) and Safari 2 (and below) support for DIMP.\n[mms] Add chance to switch between forward options on compose page when using auto-forward (DIMP).\n[mms] Add chance to switch reply type to single recipient on compose page when using auto-reply (DIMP).\n[mms] Fix printing multipage HTML messages in Mozilla browsers (Bug #8708).\n[mms] Provide command line script to obtain IMAP caching statistics.\n[mms] Catch flag changes from other IMAP clients when refreshing if CONDSTORE is available on the IMAP server (DIMP).\n[mms] Improved forwarding options.\n[mms] Add support for LIST-STATUS IMAP extension; provides more efficient mailbox polling.\n[mms] Add hook to allow determination of compose attachments MIME type.\n[mms] Move AJAX processing framework to Horde (Request #4561).\n[mms] If selected message(s) disappear from mailbox, gracefully handle in the user interface (DIMP).\n[mms] Only update search mailbox on explicit user action (Request #7297) (DIMP).\n[mms] Add auto-save draft to IMP (Request #7656).\n[mms] Add keyboard shortcut to move to next unseen message (Request #8223).\n[mms] Add hook to dynamically change mailbox label (Request #6734).\n[mms] Improved address expansion in MIMP.\n[mms] Load folders on-demand in sidebar (DIMP).\n[mms] Add priority setting to DIMP.\n[mms] Simplify and improve priority header generation/display.\n[mms] Add Face: header support to IMP.\n[mms] Add splitbar to resize sidebar in DIMP.\n[mms] Use LIST-EXTENDED IMAP extension (RFC 5258), if available, to get subscribed mailbox information.\n[mms] Split ham/spam reporting actions into two separate preferences (Request #8221).\n[mms] When clicking on base reply button, auto-determine the best way to reply to a message based on the header information.\n[mms] Add vertical-pane preview layout to DIMP.\n[mms] Wrap content-related MIME parts in a border when viewing inline to indicate their relationship.\n[mms] For drafts, save the original message index for forwards/replies so when eventually sent, log information can be updated (Request #8663).\n[mms] Upgrade RTE to CKEditor v3.\n[mms] Sort by display name for to/from fields if supported on IMAP server.\n[mms] Add ability to quickly filter by flags in DIMP.\n[mms] Add ability to select sent-mail mailbox when composing in DIMP.\n[mms] Add ability to save drafts in MIMP.\n[mms] Add spam reporting in MIMP.\n[mms] Added contextmenu support in DIMP for Opera.\n[mms] Display HTML parts inline by using IFRAMEs (based on code by rui.carneiro@portugalmail.net; Request #8592).\n[mms] Add ability to search by relative date intervals (Request #3438).\n[mms] Add advanced search query interface to DIMP (Request #6875).\n[mms] Add ability to search by a custom defined header (Request #6875).\n[mms] Improved advanced search query interface (Request #6875).\n[mms] More intelligent ordering of autocomplete search results.\n[mms] Add a mini search query interface to IMP (Request #6875).\n[mms] Make DIMP quicksearch field selection persist across sessions.\n[mms] Move JS/CSS caching to Horde framework.\n[mms] Add simple search function to MIMP.\n[mms] DIMP now honors the 'mailbox_start' preference.\n[mms] Logins now handled by Horde login handler.\n[mms] When generating and sending compressed ZIP data, use server-side temp streams to minimize memory usage.\n[mms] Decode bodypart data on server if possible (RFC 3516).\n[mms] Use PHP temporary streams when working with message body data to reduce memory usage (Request #3359).\n[mms] Add ability to expand/collapse all folders in DIMP.\n[mms] Add Folder Options menu to DIMP.\n[mms] Add save link to full message display in DIMP.\n[mms] Allow on-demand filter application (if filter backend supports) in DIMP.\n[mms] Add full IMAP subscription support to DIMP (Request #8059).\n[mms] Add message information to preview screen (DIMP).\n[mms] Add Alt + PGUP/PGDN shortcut to scroll through preview message (DIMP).\n[jan] Show possible event conflicts in iTip viewer (Request #3991, Gonçalo Queirós <goncalo.queiros@portugalmail.net>).\n[mms] Move subfolders of special folders to lower folder display tree in DIMP (Bug #8127).\n[mms] Simplify quicksearch UI in DIMP.\n[mms] Improve notification display (DIMP).\n[mms] Use mailbox names in folder confirmation actions (DIMP) (Request #8162).\n[mms] Optimize viewport row insertion/updating (DIMP).\n[mms] Add support for defining and displaying custom IMAP flags and for configuring the highlighting of system flags (Request #937).\n[mms] Move attachment display on mailbox page from hook to preference.\n[mms] Always process priority/precedence headers.\n[mms] Support $MDNSent keyword (RFC 3503) on IMAP server.\n[mms] Link URLs/e-mails in subjects in message views (Request #7487).\n[mms] Implement spellcheck on send in DIMP.\n[mms] Sanity check - don't do message operations reliant on UID list if UIDVALIDITY of mailbox has changed.\n[mms] Remember splitbar position on login/refresh (DIMP).\n[mms] Disable advanced functions if using POP3 driver (caching, on-demand filtering, searching, sorting) because it is too resource intensive.\n[mms] Use native PHP code for POP3 driver (c-client no longer required).\n[mms] IMP code now uses Exceptions instead of PEAR_Errors.\n[mms] Fix wrong charset on filenames when stripping attachments (Bug #7220).\n[mms] Use effects queue to prevent issues with users clicking on effects elements too quickly.\n[mms] Trim leading/trailing whitespace from reply/forwarded text.\n[mms] Add full IMAP message flagging capabilities to DIMP.\n[mms] Decode IDN (RFC 3490) names in addresses (Request #5836).\n[mms] Add ability to download attachments in MIMP (Request #2925).\n[mms] Revamp JS event handling model.\n[mms] ESC in DIMP search box now clears the search (Request #7196).\n[mms] Enhancements to status icon view (Request #7519) (DIMP).\n[mms] If the browser supports it, embed image data in cached CSS files via data URLs (Request #7174).\n[mms] Translate special folder names (Request #7545).\n[mms] Make autocompletion threshold parameters configurable (Request #7322).\n[mms] Add compose attachment preview to DIMP.\n[mms] Add 'unit' parameter for quota display (Carlos Pires <acmpires@sapo.pt>, Request #7044).\n[mms] Add support for '$Forwarded' IMAP keyword (Request #3402).\n[mms] Attachments in a signed message now can be downloaded via the download all attachments link (Bug #2939).\n[mms] Remember preview toggle header preference (Request #7264) (DIMP).\n[mms] Fix stripping attachments when saving to sent-mail folder when attaching the PGP public key (Bug #4221).\n[mms] Removed Special Characters menu.\n[mms] Add 'undelete' to Other Actions menu (Bug #7496) (DIMP).\n[mms] All PGP & S/MIME functions now work in DIMP (Bug #5388).\n[mms] Encrypted bodytext now appears when replying/forwarding a message (Request #1345).\n[mms] When deleting/emptying a folder, display message count (Request #7424).\n[mms] No longer need HTTP_Request - use Horde_Http_Client instead.\n[mms] Use Horde_Imap_Client as the IMAP library in IMP.\n[mms] DIMP and MIMP have been moved into IMP.\n[mms] Allow all parts in a message to be displayed (Bug #1866).\n[jan] Re-add access keys (DIMP).\n[mms] Quota template has been moved inside of base include file (DIMP).\n[mms] Added an alerts log (Request #7173) (DIMP).\n[mms] Added support to access IMP's Virtual Folders (DIMP).\n[mms] Shift-drag for messages will copy instead of move (DIMP).\n[mms] Remove support for Xinha as GUI HTML editor.\n[mms] Strip extra 'Fwd' and 'Re' cruft from subject line when replying to or forwarding a message.\n[mms] Don't send server requests when autocompleting addresses when possible.\n[mms] Added readonly mailbox and disable compose hooks.\n[mms] Saving draft on session expiration now handled via VFS.\n[mms] Add preference to delete draft on resume & send.\n"
4.3.10:
  notes: "[jan] Don't submit the action form when reloading messages with iTip attachments (Bug #9502).\n"
4.3.9:
  notes: "[mms] Fix error if user's account only contains an INBOX (Bug #9273).\n"
4.3.8:
  notes: "[jan] SECURITY: Properly escape user input in Fetchmail configuration.\n[mms] Fix updating POP3 indices when using mailbox caching (Bug #8035).\n[jan] Include \"anyone\" user when listing users in the ACL screen (Bug #9135).\n[mms] Turn DNS prefetching off when displaying untrusted message content (Request #8836).\n"
4.3.7:
  notes: "[mms] Fix spellcheck-on-send when using fckeditor and no errors exist (Bug #8833).\n[mms] Fix authenticate API call and synchronization when using realms (robin.west@dal.ca, Bugs #6749, #8872).\n[mms] Optimize folder tree initialization (Request #8805).\n[mms] Add command line fetchmail script (tjacyno@galasoft.net, Request #8812).\n[jan] Workaround broken PHP number formatting with some locales (Bug #8780).\n"
4.3.6:
  notes: "[cjh] Fix the default value for the nav_audio preference (sistemisti-posta@csi.it, Bug #8725).\n[mms] Make sure sent-mail folders exist if using the drop-down selection list on the compose page (Bug #8520).\n[mms] When replying to list, correctly extract e-mail address if multiple entries exist in the List-Post header (Bug #8719).\n[mms] For messages marked as innocent but not moved to Inbox, don't report them as deleted within the current mailbox (Bug #8221).\n[jan] Don't show address book preference group if address books are disabled (Bug #8692).\n[mms] Save References/In-Reply-To header info when saving a draft (Bug #8661).\n[jan] Fix viewing S/MIME encrypted and signed messages from Outlook (Express) (Bug #8629).\n[jan] Add Oracle-specific SQL script.\n[jan] Add Croatian translation (Matej Vela <matej.vela@carnet.hr>, Iva Rumora <iva.rumora@zg.t-com.hr>).\n[mms] Don't use translated folder prefixes in rename dialog (Bug #8554).\n[jan] Add hook to retrieve public S/MIME and PGP keys.\n"
4.3.5:
  notes: "[mms] Upgrade prototype.js to v1.6.1.\n[jan] Add example hook for the search_sources preference (dom.lalot@gmail.com, Request #7796).\n[mms] Fix renaming shared folders contained in empty namespaces (Bug #8468).\n[mms] Correctly handle NO untagged responses on login (Bug #8478).\n[mms] Correctly set charset of Bcc header in sent mail (Bug #8362).\n[mms] Fix spellcheck in text-mode for certain words in non-English locales (Bug #8330).\n[mms] Fix some javascript if using IE 8 (uses IE 7 compatibility mode) (Bug #8345).\n[jan] Allow to lock default_encrypt preference.\n[mjr] Add example hook for the add_source preference (Bug #8285).\n[mms] Fix unqualified domain preference (Bug #8272).\n[jan] Highlight signed messages depending on the signature verification.\n[mms] Fix display_folder hook (m.gabriel@das-netzwerkteam.de, Bug #8254).\n[jan] Use correct charset when rendering inline PGP data.\n"
4.3.4:
  notes: "[mms] SECURITY: Don't cache local PGP public keys retrieved from the addressbook (found by Peter Meier <peter.meier@immerda.ch>).\n[mms] If using spellcheck on send, automatically send if no spelling errors exist (Request #6892).\n[jan] Show all addresses when printing messages.\n[mms] Fix cache issues in folder tree when deleting a mailbox (Bug #7745).\n[mms] Fix updating POP3 indices when deleting in mailbox view (Bug #8035).\n[jan] If updating a calendar event fails, try to import it instead (Bug #7589).\n[mms] Fix [un]escaping of various URLs on message screen caused by security fixes in v4.3.3 (Bug #7926).\n[jan] Fix rendering of subjects in RTL scripts when using LTR translations (vilius@lnk.lt, Bug #3511).\n[mms] Add hook to allow hiding of IMAP folders (Gunnar Wrobel <p@rdus.de>, Request #7353).\n[jan] Fix logging of messages forwarded with attachments (Bug #7911).\n"
4.3.3:
  notes: "[cjh] SECURITY: Escape output in message.php, pgp.php and smime.php (found by Gunnar Wrobel <p@rdus.de>).\n[jan] Use all credentials and mailer settings for iTip replies (Bug #7388).\n[mms] Show translated 'INBOX' prefix for subfolders (Request #7759).\n[mms] Workaround obsolete 'UT' date format (Request #5717).\n[mms] Fix tracking folder changes when renaming (Bug #7772).\n[cjh] Suppress browser autocomplete when redirecting messages (Bug #7767).\n"
4.3.2:
  notes: "[mms] Fix prototypejs regression on IE (Bug #6590).\n"
4.3.1:
  notes: "[jan] SECURITY: Escape output in test.php.\n[mms] Don't include Virtual Folder information in when tracking folder tree changes (Bug #7739).\n[mms] Marked stripped parts as 'attachment', not 'inline' (Request #4664).\n[mms] Fix linking from addresses in mailbox to compose screen (Bug #7432).\n[jan] Use mailer configuration when sending iTip replies (Bug #7388).\n[jan] Always display multipart/appledouble attachments.\n[mms] Upgrade prototype.js to v1.6.0.3.\n"
4.3.0:
  notes: "[jan] Add compose token to redirect view (Bug #7383).\n[jan] Don't resize window if not composing messages in a popup.\n"
4.3.0-RC2:
  notes: "Original version string was 4.3.0RC2\n[mms] Fix loading of print stylesheets when printing a message (Bug #7310).\n[mjr] Fix redirect loop when conf[server][change_server] is true (Bug #6978).\n[mms] Fix message caching and optimize storage.\n[mms] Fix autocomplete address positioning on IE (Bug #7074).\n[cjh] When the selected view doesn't match the type of browser's default view (IMP or DIMP for a mobile browser, MIMP or DIMP for a desktop browser), explicitly redirect to that view and disable the frameset (Bug #6332).\n[jan] Add support for updating exsting events and cancelled recurring event instances to iTip viewer (Bug #6636).\n[mms] Fix uploaded compose attachment names if magic quoting is on (Bug #7215).\n[mms] Cache results of address formatting.\n[jan] Show name and email address in the address book popup (Request #6937).\n[mms] Messages from lists can now have large quotes automatically hidden.\n"
4.3.0-RC1:
  notes: "Original version string was 4.3.0RC1\n(released as v4.2.1-RC1)\n[mms] Fix incorrect autocomplete replacement in certain cases (Bug #6819).\n[mms] Use optimized autocomplete javascript library.\n[mms] Handle ';' to delimit addresses when composing.\n[jan] Don't allow adding private PGP keys as public keys (Bug #7080).\n[jan] Add Basque translation (Euskal Herriko Unibertsitatea EHU/UPV <xabier.arrieta@ehu.es>).\n[mms] Search by size now displayed in KB (Request #6921).\n[jan] Add option to attach personal vCard to message (requires Turba 2.2.2).\n[jan] Fix maildir quota driver (Bug #7014).\n[jan] Add configuration for quota message format.\n[mms] Maintain original header encoding on redirect (Bug #7006).\n[cjh] Add CSRF tokens to the Compose screen (Kris Steinhoff <steinhof@umich.edu>).\n[jan] Fix adding vhost specific trailer.txt.\n[jan] Add more flexible placeholders to SQL quota driver.\n[jan] Fix passing passwords to quota drivers.\n[mms] Improved folder list generation (Bug #6972).\n[cjh] Allow hiding quota messages when quota is unlimited (Thomas Jarosch <thomas.jarosch@intra2net.com>, Request #6934).\n[jan] Add mailto: handler for Firefox 3+.\n[mms] Fix address MIME encoding issues when saving a draft (Bug #6986).\n[cjh] Include a hint about fixing invalid From addresses in the error message (steinhof@umich.edu, Bug #6941).\n[cjh] Fix overwriting $params in _imp_adminDo API call (Bug #6955).\n[mms] Never wrap flowed lines in text/plain messages.\n[mms] Fix broken spellcheck when using fckeditor on Safari 3 (Bug #6909).\n[mms] Fix unescaping URL parameters passed to popup windows (Bug #6834).\n[jan] Fix logging of forwarded messages.\n[mms] Fix creation of subfolders in certain namespaces (thomas.jarosch@intra2net.com, Bug #6827).\n[mms] Improve search page by moving flags into search criteria section (Request #6825).\n[mms] If using imagemagick, allow creation of PDF thumbnails.\n[mms] Strip quotation marks and backslashes from displayed addresses.\n[mms] Fix spellcheck in HTML mode when using Xinha on IE (Bug #6799).\n[mms] Fix rare case when spellchecking HTML input could result in the HTML tags being recognized as misspelled words.\n[jan] Fix parsing for Token System configuration parameters.\n[mms] Add ability to search by size.\n"
4.2.2:
  notes: "[cjh] SECURITY: Escape output in message.php, pgp.php and smime.php (found by Gunnar Wrobel <p@rdus.de>).\n"
4.2.1:
  notes: "[jan] SECURITY: Escape output in test.php.\n"
4.2.0:
  notes: "[cjh] Fix display of email groups in received messages.\n[cjh] Fix sending email to contact lists (Bug #6732).\n[cjh] Make sure that email addresses entered in the Identities screen pass basic well-formedness validation (Bug #6654).\n[cjh] Fix default server selection on the login screen (adrieder@sbox.tugraz.at, Bug #6738).\n[cjh] Fix defaulting to the wrong address book in the Contacts popup (steinhof@umich.edu, Bug #6723).\n"
4.2.0-RC4:
  notes: "Original version string was 4.2.0RC4\n[mms] Add ability to cache JS/CSS files to static files to improve performance and to fix problems when updating JS/CSS files.\n[cjh] Apply fix for http://dev.rubyonrails.org/ticket/11473 to prototype.js (Request #6590).\n[cjh] Make request token lifetime configurable (faurep@agr.gc.ca, Request #6679).\n[mms] If using SMTP, send messages using 8BITMIME (RFC 1652) or BINARYMIME (RFC 3030) if appropriate (Request #6645).\n[cjh] Work around a spellchecking issue with proc_close and --enable-sigchild (Bug #6625).\n[jan] Show user drop down list in ACL screen if possible.\n[mms] Redirect after doing maintenance to the proper view (Bug #6179).\n[mms] Allow switching views in mobile login mode (Request #6332).\n[jan] Support vhosts setting when loading header.php, servers.php, spelling.php and trailer.txt configuration files.\n[mas] Use delete icon on search page to remove elements. (Liam Hoekenga <liamr@umich.edu>, Request #6515).\n[mms] Add link to delete entire thread on thread screen (Request #5884).\n[mms] Hide trash-related options when trash is disabled.\n[jan] Allow users to specify server name and login credentials in Horde's preferences (requires Horde 3.2).\n[mms] Message cache now stored in configurable chunks to reduce memory usage.\n[mms] Fix mailbox list caching when hiding deleted messages.\n"
4.2.0-RC3:
  notes: "Original version string was 4.2.0RC3\n[mas] Replace %l and %d with the current short username and domain name in spam reporting shell calls. (Bug #6364)\n[cjh] Add a hook quota driver (Michael.Redinger@uibk.ac.at, Request #6322).\n[mms] Make xinha add BR tag instead of P tag on enter keypress (Mozilla only).\n[mms] Add fckeditor to list of supported javascript editors.\n[jan] Hide iTip actions if not using IMP frontend (Bug #6116).\n[cjh] Fix showing suggestions for the second or subsequent misspelled word (Bug #6081).\n[jan] Add configuration option to force users to a certain view.\n[jan] Localize default folder names.\n[jan] Call a contacts/add API method to create links for adding contacts if available.\n[jan] Filter HTML body when replying to HTML messages with the WYIWYG editor.\n[jan] Allow users to set the HTML editor toolbar buttons in their preferences.\n[jan] Fix charset of composed HTML messages (Bug #6268).\n[cjh] Protect mailbox, message, and folder actions with CSRF tokens.\n[cjh] Fix action dropdowns in IE6 (Bug #6177).\n[cjh] Make sure to call Event.extend() when using inline event handlers, for IE6's benefit.\n[cjh] Fix improper enabling of HTML composition on replies (Bug #6176).\n[jan] Use subject's CN instead of OU for storing public keys (Bug #6169).\n[cjh] Make sure that custom checkbox preferences are stored as 0 or 1 instead of 'on' or ''.\n[jan] Fix popup URL generation (Bug #6139).\n"
4.2.0-RC2:
  notes: "Original version string was 4.2.0RC2\n[mms] SECURITY: When sending linked attachments, protect against JAR attacks in some Mozilla browsers (Bug #5892).\n[cjh] Fix the bottom Select: menu in the mailbox view (Bug #6128).\n[mms] Add hook for adding formatting information to a message list row (Request #5234).\n[mms] If javascript is available, automatically size the popup compose window.\n[jan] Allow to write outside of HTML signatures in WYSIWYG editor (Bug #3753).\n[jan] Highlight HTML signatures in WYSIWYG editor.\n[jan] Remember webmail mode selected on the last login.\n[mms] Compress download data.\n"
4.2.0-RC1:
  notes: "Original version string was 4.2.0RC1\n[jan] Fix broken <area> tags in HTML messages.\n[mms] When sending notification that linked attachment has been downloaded, correctly set timezone in download time (Bug #4609).\n[cjh] If encrypting a message, encrypt an attached public key as well (Bug #5733).\n[jan] Remove \"default search field\" preference, show all common fields instead.\n[cjh] Rename IMP_IMAP_Client::namespace to getNamespace() for PHP 5.3 compatibility.\n[cjh] Cache PGP public keys for one hour (adrieder@sbox.tugraz.at, Request #5773).\n[mms] Add mailbox list caching across sessions.\n[cjh] Don't translate \"Fwd:\" in email subjects (Request #5674).\n[jan] Add link to strip all attachments from a message.\n[jan] Show owner of S/MIME cert in signed messages, not the message sender.\n[jan] Allow maintenance tasks to rename and delete fixed folders (Bug #5592).\n[mms] Allow all javascript and CSS in a page to be served in a single browser request.\n[jan] Move all IMP-specific hook examples from Horde's config/ directory.\n[jan] Fix compose window widgets with certain translations (Bug #5638).\n[jan] Fix sidebar tree generation with certain translations (Bug #5525).\n[cjh] Fix spellchecking HTML messages with active links (Bug #5629).\n[cjh] Fix a fatal error when composing for users with no signature (Bug #5682).\n[cjh] The pspell extension is no longer supported for spell checking since it doesn't work with HTML composition at all (Bug #5516).\n[cjh] Fix switching signatures when using HTML composition (Bugs #3753, #5594).\n"
4.2.0-alpha1:
  notes: "Original version string was 4.2.0alpha\n[jan] Add configuration for folders that may not be modified.\n[mms] Inline PHP-generated javascript to avoid cross-domain leaking (Bug #5307).\n[cjh] Preserve current mailbox when composing in the main window (Bug #5415).\n[cjh] Add a few more new mail sounds and allow the user to choose between them (Request #3260).\n[mms] Preserve URL anchor information when performing login.\n[jan] Fetch public PGP keys from keyserver if not available in address book (Requires Horde 3.2).\n[mms] Add compose support for e-mails containing Internationalized Domain Names (Request #5180).\n[jan] Add a hook for post sending actions, after a message has been sent.\n[mms] Add option to login screen to allow user to select the application mode if either DIMP or MIMP is also installed.\n[jan] Add unified IMAP quota driver to obsolete the Cyrus and Courier drivers.\n[mms] Don't allow namespace delimiters in new mailbox names.\n[mms] Change 'Important' flag to 'Flagged For Followup' and clear the flag after a reply (Request #4867).\n[mms] Allow display of shared/public folders separate from a user's personal folders (Request #3581).\n[mms] Allow thumbnails to be generated for all attached images, regardless of image size.\n[cjh] Add a modal confirmation dialog for emptying a folder (Request #4812).\n[mms] Add ability for admin to limit size of reply text.\n[mms] Add RSS/Atom feed for mailboxes (Eric Garrido <ekg2002@columbia.edu>, Request #2733).\n[mms] If tidy is available, use it to clean up outgoing HTML messages.\n[mms] Automatically delete blacklisted messages (Request #4569).\n[cjh] Implement non-modal newmail popups (Request #3327).\n[mms] Add option to restrict size of MIME message parts that can be displayed inline.\n[cjh] Add a Help entry for keyboard navigation (Bug #4716).\n[mms] Most javascript code now uses the Prototype library.\n[jan] Address auto-completion searches only at beginning of names and addresses.\n[jan] Add button to empty the current folder.\n[jan] Show percentage of attachment limit usage in compose window (Eric Garrido <ekg2002@columbia.edu>, Request #3434).\n[jan] Add SQL driver for quotas (Tomas Simonaitis <haden@homelan.lt>, Request #4053).\n[mms] Allow user to view PGP encrypted messages sent by themself (Bug #4332).\n[mas] Make ACL editor more intuitive (Eric Garrido <ekg2002@columbia.edu>, Request #3808).\n[mas] Conform to WCAG 1.0 Priority 2/Section 508 accessibility guidelines. (Request #4080)\n[mms] Added preference to allow composition in reply/forward based on \"richest\" format available in original message (Request #4270).\n[mms] Added preferences to determine default forwarding method and whether to include body text in forwards by default.\n[mms] Add preference to only verify PGP & S/MIME signed data upon user request (Request #4022).\n[mms] Add preference to indicate default cursor location in compose text area (Request #3245).\n[jan] Add support for symmetric PGP encryption (Requires Horde 3.2).\n[cjh] Add an onbeforeunload handler so Firefox and IE users can be prompted before accidentally closing a compose window (phyre@rogers.com, Request #4271).\n[jan] Move mail_hdr preference from identities to a regular preference.\n[mms] Remove current mailbox information from session - allows multiple simultaneous open IMP windows (Request #3171).\n[mms] Add folder size display to folders screen (Request #4065).\n[mms] Add ability to filter HTML message output with tidy (Request #388).\n[cjh] Show thumbnails of large images instead of linking to them (Eric Garrido <ekg2002@columbia.edu>, Request #3808).\n[mms] Page location in mailbox is remembered for subsequent mailbox visits.\n[mas] Add maintenance task to purge old messages from spam folder (Request #3860).\n[mms] Implement mailbox message list caching.\n[mms] Port AJAX spell checking code from DIMP.\n[mms] Port auto-complete contacts AJAX code from DIMP.\n[mms] Add preference to poll all folders for new mail (Request #2197).\n[mms] Allow admins to add \"Printed By\" headers to the top of all printed messages (Request #1965).\n[mms] Allow user to save per-folder sort preferences (Request #1483).\n[jan] Add multidomain support for Kolab servers (tokoe@kde.org, Request #3579).\n[cjh] Add a hook for post-login actions, after the session is established but before redirection.\n[mms] Recent search queries can be retrieved on the search page (Request #3337).\n[mms] Convert all templates to Horde_Template::.\n[cjh] Show vTodo parts in the iTip driver (Request #3344).\n[jan] Add maintenance task to purge old messages from sent-mail folders.\n[cjh] Move allow_cc and allow_bcc to compose_cc and compose_bcc preferences.\n[ben] Better support for MS-SQL.\n[jan] Whether and where to show alternative mime parts is now a preference instead of MIME configuration.\n[mms] Split out custom spelling dictionary into separate configuration file.\n[jan] Delete original message after saving a resumed draft.\n[cjh] If the browser supports the necessary javascript, unblock images in HTML messages without a page reload.\n[cjh] Do all message styling based on flags with CSS.\n[mms] Implement message caching.\n[jan] Add permissions to restrict maximum number of recipients per message and time.\n[jan] Add API method \"contacts/favouriteRecipients\".\n[jan] Add logging of sent messages.\n"
4.1.6:
  notes: "[jan] Fix sentmail folder not being updated in the preference interface after updating to Horde 3.1.5 (Bug #5842).\n[jan] Fix broken <area> tags in HTML messages.\n"
4.1.5:
  notes: "[cjh] Lower memory usage when downloading folders (Andrew Morgan <morgan@orst.edu>).\n[mms] Fix detection of default namespace information when no namespaces are defined on the server (Bug #5538).\n[mms] Don't lose message bodies When moving messages to trash when over quota (Bug #5470).\n[cjh] Remove unused defaults in Fetchmail_imap (Bug #2799).\n[jan] Fix empty folder name appearing on Cyrus and servers with similar namespaces (Bug #5138).\n[jan] Only show reply options in iCalendar viewer if a reply is requested.\n[cjh] Remove non-responsive www.keyserver.net and wwwkeys.pgp.net from PGP options (Bug #5323).\n[jan] Fix moving messages when over quota on Dovecot servers (Bug #5270).\n[jan] Fix parsing of certain distribution lists (Bug #5134).\n[mms] Fix rare occurrence where an action perfomed on the mailbox screen would instead be performed on the INBOX (Bug #5202).\n[mms] Don't show save attachments prompt in compose screen if configured to automatically link all attachments (Request #5189).\n"
4.1.4:
  notes: "[jan] SECURITY: Fix XSS vulnerabilities in the search screen and thread view.\n[jan] Improve displaying of PGP messages (requires Horde 3.1.4 partially).\n[mms] Make sure we pass a read/write IMAP stream to the filters API (Bug #5054).\n[mms] Do not allow move to trash unless trash folder is defined (Bug #5012).\n[jan] Fix an encoding issue with the address book popup (Bug #5050).\n"
4.1.4-RC1:
  notes: "Original version string was 4.1.4RC1\n[cjh] \"Ignore All\" spellchecking fixes (technology@pmi-portland.org, Bug #4922).\n[cjh] Absolute restriction on the width of the contacts window select elements (Request #1985).\n[cjh] Send lowercase mailto: attributes in iCalendar replies (Bug #4872).\n[cjh] Don't improperly increment iCalendar SEQUENCE values (Bug #4863).\n[mms] Always subscribe to created folders.\n[mms] Don't allow both trash folder and Virtual Trash to be selected in the options (Bug #4698).\n[cjh] Turn mailto: links in HTML emails into IMP compose links (Bug #3079).\n[cjh] Attempt to calculate the actual filesystem block size in the IMP_Quota_command driver (Eric Rostetter <eric.rostetter@physics.utexas.edu>, Request #4360).\n[cjh] Make sure to honor user date format preferences in iTip viewer (Bug #4635).\n[cjh] Fix message list header underflow in IE7 (Bug #4608).\n[cjh] Don't return empty sent-mail folders from the identity (Bug #4380).\n[cjh] Don't rename folders from or to an empty string (Bug #4380).\n[mas] Don't replace spaces with '.' when expanding addresses. (Bug #4236)\n"
4.1.3:
  notes: "[mms] Add 'login_tries' server configuration option.\n[jan] Fix toggling compose mode if folders are turned off (Bug #4216).\n[mms] Fix blacklist/whitelist reporting (Bug #4160).\n[jan] Add link to view attached S/MIME key details.\n[cjh] Correctly escape all folder names.\n[mjr] Correctly restrict gallery list when saving images to a gallery program.\n[jan] Send notifications about downloaded attachments to address from identity.\n[mms] Escape group names pursuant to RFC 2822 (Bug #4018).\n[mms] Fix saving images to gallery program (e.g. Ansel) from search mailboxes (Bug #4046).\n"
4.1.2:
  notes: "[mas] Check Cyrus quota for current mailbox, instead of always showing INBOX. (Eric Garrido <ekg2002@columbia.edu>)\n[cjh] Send linked attachment notifications in the language of the user who sent the attachment (Bug #3712).\n[mms] Fix appending default personal namespace to default sent-mail folder (Bug #3873).\n[mms] Fix IMAP logins for some servers that throw in extraneous server information (Bug #3793).\n[mms] Quote IMAP usernames when using LOGIN authentication to allow usernames with spaces to login (Bug #3778).\n[jan] Fix creating folders through the api (Bug #3787).\n[mms] Added preference to toggle display of Virtual Inbox.\n[mms] Fix display of Virtual Trash (Bug #3665).\n"
4.1.1:
  notes: "[mms] Silence some undefined warnings if folders are off (Bug #3755).\n[cjh] Escape X-color data (Bug #3751).\n[mms] Never open connection to specific mailbox unless we need it.\n[mms] Don't allow IMP preference access unless authenticated.\n[mms] Fix moving message to trash folder when over quota (Bug #3687).\n[mms] Add preference for default charset to be used for messages with improper charset information (requires Horde 3.1.1) (Request #2702).\n[mms] Fix stripping attachments (Bug #3510).\n[mms] Fix creation of duplicate Virtual INBOXes.\n[mms] Fix displaying Show/Hide/Purge links for deleted messages in certain cases.\n[jan] Fix downloading of all attachments from certain messages in a ZIP file with Internet Explorer.\n[mms] Use other login methods in IMP_IMAPClient:: if the first method is unsuccessful, to make Exchange working again.\n[mms] If an IMP maintenance task is activated, make sure the Horde preference controlling maintenance is also activated (Bug #2987).\n[mms] Fix spellcheck on send (Bug #3589).\n[mms] Allow user to select sent-mail folder in public namespace if public namespace is blank (Bug #3603).\n[mms] Add preference to define how we want to expand folder list in sidebar.\n"
4.1.0:
  notes: "[mms] Correctly expunge current mailbox when deleting messages on a POP3 server (Bug #3156).\n"
4.1.0-RC3:
  notes: "Original version string was 4.1.0RC3\n[mas] Add Hebrew translation.\n[mms] Attempt to login to mail server multiple times on non-auth failure to eliminate some \"random\" session timeouts (ag@netside.de, Bug #3404).\n[mms] Allow configuration of server timeouts in servers.php.\n[jan] Less intrusive notification when expanding of addresses in the compose view fails (Dmitriy MiksIr <miksir@maker.ru>).\n[mms] IMP_IMAPClient:: now uses the Auth_SASL PEAR module during CRAM-MD5 and DIGEST-MD5 authentication.\n"
4.1.0-RC2:
  notes: "Original version string was 4.1.0RC2\n[jan] Add Khmer translation (Leang Chumsoben <soben@khmeros.info>).\n[mms] Make Linked attachments work in multipart/alternative messages (Bug #3335).\n[mms] Allow selection of Virtual Folder for login mailbox (Bug #3315).\n[mms] Prompt user before sending messages with empty subjects (Bug #3333).\n[mms] Add ability to edit search queries.\n[jan] Log correct address in login success message if connecting through a proxy (Bug #3289).\n[jan] Fix forwarding of multiple messages.\n[jan] Fix confirmations after successfully sending messages (Bug #3233).\n[jan] Apply _imp_hook_mbox_icons hook to the sidebar folder tree (Bug #3132).\n[mms] Re-add option to rebuild folder tree from IMAP server.\n[mms] Fix sent-mail folder selection in compose view (Bug #2802).\n[cjh] Fix redirection to initial_application preference after running Maintenance tasks.\n"
4.1.0-RC1:
  notes: "Original version string was 4.1.0RC1\n[mms] Removed 'dotfiles' server parameter.\n[mms] Allow PHP expressions to be executed for user-defined headers (Bug #3093).\n[mms] Support 'DelSp' parameter in flowed text messages (requires Horde 3.1).\n[mms] Remove outdated, non-standards request for delivery confirmation.\n[mms] Hide lengthy address lists by default in message view and allow the user to toggle viewing (flachapelle@inverse.ca, Bug #3028).\n[cjh] Account for changes to strtotime() in PHP 5.1.\n[mms] It is not possible to hide deleted messages when using thread sort.\n[mms] Option to send notification that linked attachment has been downloaded, and link to delete the attachment (Bug #696).\n[mms] After fetching mail, return to the local mailbox where mail is downloaded to (Bug #2211).\n[mms] Check the IMAP server to see if it supports searches in the current charset.\n[mms] Do not require users to click on 'Attach' button when attaching files in the compose screen (Bug #2848).\n[mms] Don't display unsubscribed folders in sidebar (Bug #2869).\n[mms] Rename folders from top of tree to bottom to prevent errors on IMAP servers that automatically rename all child folders (Bug #2882).\n[mms] Fix opening compose popups when the mailbox contains urlencoded characters (Bug #2872).\n[mms] Fix refresh of folders when not using IMAP subscriptions (Bug #2878).\n[cjh] Skip results with empty email addresses when expanding names (Bug #2757).\n[cjh] Replace %u with the current username in spam reporting shell calls (Dmitriy MiksIr <miksir@maker.ru>).\n[mms] Don't ask for password for decryption when the user does not have a personal private key (Bug #2771).\n[mms] Add API method to return logged in server hostname.\n[mms] PGP encrypted messages now encrypted to all recipients in the same message (Bug #2670) (requires Horde 3.1).\n[mms] Added preference to define the default search field (Bug #2650).\n[jan] Add ability to create notes from email messages.\n[jmf] Add support for changing SMTP server/port on login (Bug #327).\n[mms] Removed 'folders', 'namespace, and 'hierarchies' server parameters.\n[mms] Add auto-detection of namespace information from IMAP server.\n[cjh] Support configuring where the \"Report as\" spam/innocent links appear (dustin@ywlcs.org, Bug #1096).\n[mms] Add preference to move spam/innocent messages to appropriate mailbox after reporting.\n[mms] Add multiple message view page (Bug #481).\n[jan] Add stationery and form responses.\n[cjh] Differentiate between signed and encrypted attachments (Bug #1712).\n[jmf] Ability to play sound on new mail.\n[jan] Add permissions to restrict creation of folders.\n[mms] Add configuration option to allow message bodies to be cached across page loads.\n[ben] Honor horde's alternate_login and redirect_on_logout settings.\n[jan] Add \"Empty Spam\" menu item (Bug #1765, jens@peino.de).\n[mms] Add Virtual INBOX to Virtual Folders.\n[mms] Make sure special Virtual Folders can never be edited.\n[mms] Allow import of photo attachments into a gallery application.\n[mms] Fix IMAP thread display when the base level contains more than one message.\n[mms] Better/more complete preview message generation.\n[mms] Graphical representation of thread on thread view screen.\n[mms] Virtual Trash folder support (Todd Merritt <tmerritt@email.arizona.edu>).\n[mms] All composed messages are now sent in \"flowed\" format. The \"wrap_width\" preference has been eliminated.\n[mms] Success messages are not shown when adding a blacklist/whitelist address if an error in adding the address(es) occurred.\n[mms] No need to show a \"Hide HTML images\" link if the images have already been displayed.\n[mms] Include Cc: header information in the header text we display for forward and reply messages (Bug #1079).\n[jan] Show ZIP icon with \"Download all attachments\" link.\n[mms] S/MIME parts should always attempt to be viewed inline, notwithstanding the Content-Disposition for the part (requires Horde 3.1).\n"
4.0.5:
  notes: "[cjh] Correctly escape all folder names.\n[jan] Fix French translation.\n"
4.0.4:
  notes: "[mms] Add warning that PGP key generation may take awhile (Bug #2672).\n[mas] Add confirmation when reporting spam/innocent from message view. (kevin_myer@iu13.org, Bug #2285)\n[cjh] Fix check for duplicate addresses when automatically saving recipients (Bug #2663).\n"
4.0.4-RC2:
  notes: "Original version string was 4.0.4RC2\n[mms] Fix additional newlines being added to forwarded messages when using sendmail on *NIX (Bug #2449, t.zell@gmx.de).\n[mms] Fix BCC addressess disappearing when resuming a message (Bug #2558).\n[mas] Fix reporting multiple messages as spam at once. (horde.org@spamvrij.kicks-ass.org, Bug #2549)\n[mms] Add entire message search to search page.\n[jan] Fix warnings if expanding names with spaces (Bug #2334).\n[mms] Don't display body text in thread view if inline viewing of the content is disabled.\n[jwm] Renamed Accounts menu item to Fetch Mail for more consistency.\n"
4.0.4-RC1:
  notes: "Original version string was 4.0.4RC1\n[jan] Decode folder name when importing messages (ddibox@mail.ru, Bug #2479).\n[jan] Send iTip replies with the correct identity (Bug #1507).\n[jan] Name downloaded ZIP file with all attachments after the message subject.\n[jan] Allow to accept invitations and add them to the calendar at once.\n[jan] Show iTip attachments (event invitations) inline (Request #2032).\n[mms] Fix display of localized INBOX name in folder list/sidebar (Bug #2368).\n[mms] Fix display of linked attachments when the attachment filename contains characters that need to be escaped.\n[mms] Fix OR searches when user is hiding deleted messages.\n[mms] Save drafts so any images added via the HTML editor will correctly reappear when the message is resumed (Bug #1977).\n[mms] Allow HTML formatting to be retained when resuming a draft (Bug #2328).\n[mms] Work around broken c-client sort by arrival. Turns out to be more efficient anyway (Bug #2139).\n[jan] Add Bosnian translation (Vedran Ljubovic <vljubovic@smartnet.ba>).\n[mms] If user selects a non-default sentmail folder on the compose screen, make sure this is saved through any intervening spelling check (Bug #2093).\n[mms] Ensure that no maintenance tasks may be skipped (Bug #1926).\n[mas] Protect against special characters at the beginning of a line when using aspell. (Bug #2060)\n[cjh] Generate only one Select All checkbox on search results listings spanning multiple mailboxes (Bug #1991).\n[jan] Block embedded images if viewing HTML messages in a popup.\n[cjh] Don't lose incomplete addresses after expansion is attempted. (Bug #1900).\n[jan] Fix background expansion of non-ascii names in compose view (Bug #1575).\n[jan] Allow non-ascii searches (requires Horde 3.0.5).\n[mms] Don't pass server information via login page if not being altered by the user. (Bug #1883)\n[mms] Add separate confirmation page when deleting/emptying folders (Bug #783).\n[cjh] Allow sending blank searches to Turba even if the display_contact preference is false (Bug #1854).\n[mms] Encode attachment parameters with the same character set used in the base message (Bug #1591).\n[mms] Don't allow user to unsubscribe from INBOX.\n[mms] Don't alter header encodings when redirecting messages (Bug #1823).\n[mms] Fix charset issues with strip attachment message (Bug #1861).\n[cjh] Add missing binary.png for the TNEF MIME Viewer (Bug #1873).\n[jan] Localize all remaining INBOX strings in the interface.\n[mms] Fix drop down lists in folder preferences (Bug #1794).\n[jan] Fix compose links with non-ascii characters in email header links on Internet Explorer (Bug #1726).\n[mms] Ignore empty lines in config/header.txt (Bug #1770).\n[cjh] Don't trigger the left/right key message navigation if the user is holding down any modifier keys - let those bubble up to the browser (Bug #1763).\n[cjh] Only use a Refresh: header if we need to, and if the URL is under 160 characters, to prevent triggering browser bugs that cause hangs (Bug #1728).\n[cjh] Prevent IE from clearing compose window fields if the user presses ESC (Bug #1686).\n"
4.0.3:
  notes: "[jan] Ignore quoted text if spellchecking with aspell (Bug #1673, kevin_myer@iu13.org).\n[cjh] Fix typo in attachment.php that caused a PHP warning (Xavier Montagutelli <xavier.montagutelli@unilim.fr>).\n[mms] Correctly store all data from the compose screen when spell checking a message (Bug #1425).\n"
4.0.3-RC1:
  notes: "Original version string was 4.0.3RC1\n[cjh] Validate outgoing email addresses before sending mail (Bug #1543).\n[mms] Added automatic detection of some mail server parameters to the test script.\n[mms] Fix Show/Hide Deleted links on search results screen (Bug #1587).\n[mms] Correctly process 'Report and Spam' and Blacklist/Whitelist additions from a search results mailbox view.\n[mms] Correctly sort the contents of the Virtual Folder.\n[mms] Fix viewing mailboxes in shared hierarchies in subscribe mode in the IMAP_Tree lists (Bug #1550).\n[jan] Return to current folder after emptying the trash folder (Bug #1563).\n[mms] Display the attachment expiration date when sending linked attachments.\n[mms] Fix editing virtual folders from the mailbox screen (Bug #1490).\n[cjh] Log logouts at the same level Horde does (Bug #1499).\n[jan] Don't lose session if clicking on link after blacklisting or whitelisting addresses (Bug #1417).\n[mms] Fix refresh of folder screen when viewing unsubscribed folders.\n[mms] Added optional 'delimiter' parameter to servers.php to aid login times for certain IMAP servers (selsky@columbia.edu, Bug #1485).\n[mms] Don't link emails in HTML message compositions (Bug #1472).\n[mms] Make sure we can create thumbnails/convert images before prompting user.\n[mms] Ensure multipart/related and multipart/alternative messages can be viewed if not viewable inline or if they contain only one part; multipart/related parts are now viewed with their correct charset (Bug #1433).\n[mms] Fix display of IMAP hierarchies in the folder view (Bug #1403).\n[jan] Fix viewing of multipart S/MIME or PGP signed messages (Bug #1393).\n[jan] Mark sent-mail checkbox when changing the sent-mail folder in the compose screen.\n[mms] Be smarter about we we consider to be downloadable/forwardable. Make sure text isn't both forwarded and attached in a forward message.\n[jan] Fix success screen after redirecting a message (Bug #1374).\n[jan] Fix \"undefined index\" warning (Bug #1367).\n"
4.0.2:
  notes: "[mms] Don't wrap flowed text in print view (Bug #1318).\n[jan] Don't append trailer text twice if sending a message resumed from a draft (Bug #1306).\n[mms] Fix display of attachment names when forwarding messages (Bug #1300).\n"
4.0.2-RC1:
  notes: "Original version string was 4.0.2RC1\n[mms] Decode the contents of preview messages.\n[mms] Fix reload of underlying window after entering PGP or S/MIME passphrase (Bug #1145).\n[cjh] Fix recompose recovery of messages written before a session timeout (Bug #1209).\n[mms] Don't escape 'From' at the beginning of the line in text messages.\n[mms] Fix 'smtphost' and 'smtpport' configuration parameters.\n[jan] Add batchCompose API method.\n[mms] Fix a (very rare) situation where a base64 encoded message is not decoded correctly in forwards/replies (Bug #1077).\n[mms] Fix forwarding as a digest from search folders (Bug #1263).\n[cjh] Fix PHP notice after forwarding a message (Bug #1283).\n[mms] Show, but don't activate current folder in \"Move/Copy To\" folder list (Bug #1240).\n[mms] Make sure we show container folders in the search screen folder list.\n[mms] Don't show address book save link for PGP and S/MIME keys if no default address book is configured (Bug #1144).\n[mms] Require virtual folders to have a label (Bug #1160).\n[jan] Speed up mailbox loading by caching processed email addresses.\n[jan] Fix new mail notification popups in mailbox views (Bug #876).\n[jan] Fix custom_login.php example script.\n[cjh] Don't insert entries for emails that already exist when gathering addresses from outgoing emails (Bug #1054).\n[jan] Fix wrapping of header in mailbox view with IE (Bug #1110).\n"
4.0.1:
  notes: "[cjh] Fix columns running in to each other with Safari/KHTML in the mailbox view (requires Horde 3.0.1) (Bug #1026).\n[mms] Allow signed messages sent via multipart/encrypted to be displayed on non S/MIME enabled installations (Bug #1037).\n[cjh] Fix for login_compose when IMP does not provide authentication (Bug #892).\n"
4.0.0:
  notes: "[mms] Messages sent in HTML format no longer link email addresses to non-existant javascript calls.\n[jan] Use short, indented folder names in search form.\n[jan] Return to correct mailbox page when clicking \"Back to\" link in threaded view.\n[jan] Fix sorting of folder names in summary block (Bug #987).\n[mms] Determine the default IMAP delimiter according to RFC 3501.\n[mms] Added 'smtpport' parameter to server configuration (bergonz@labs.it).\n[jan] Correctly wrap quoted headers in message replies (Bug #962).\n[jan] Show buttons on \"message sent\" screen as menu again.\n"
4.0.0-RC3:
  notes: "Original version string was 4.0.0RC3\n[jan] Fix link generation in HTML composer (Bug #941).\n[cjh] Always honor the login_compose action (Bug #892).\n[cjh] Save messages with a \"message/rfc822\" mime type (Bug #922).\n[mms] Don't require to configure an e-mail address if using a spam hook.\n[mms] Fix expansion of e-mail addresses (Bug #889).\n[mms] Fix display of user-defined headers if the message contains more than one of those headers (Bug #912).\n[jan] Set one global date format in Horde's preferences (Bug #788).\n[jan] Fix some javascript errors with IE 5.0.\n"
4.0.0-RC2:
  notes: "Original version string was 4.0.0RC2\n[mms] Allow more than one recipient for encrypted messages; store encrypted messages locally using the local user's encryption (Bug #865).\n[mms] Fix various S/MIME issues and update the code to more closely match the look and feel of the PGP code.\n[jan] Fix automatic spell checking on send, cutting off parts of the message (Bugs #227, #259).\n"
4.0.0-RC1:
  notes: "Original version string was 4.0.0RC1\n[jan] Fix HTML message editor in IE (Bugs #692, #793).\n[cjh] Search only the preferred address books for senders allowed to send HTML messages with images.\n[jan] Disable Kolab servers if Kolab has been disabled globally.\n[mms] Allow all subscribed folders to be viewed in the IMP menu tree interface.\n[mms] Only scan for emoticons in the body of text MIME parts.\n[mms] Fix message saving and attachment ZIP file generation.\n[mms] Allow the spam reporting system to bounce a message to an email address.\n[mms] Move spam handling to a separate class.\n"
4.0.0-beta1:
  notes: "Original version string was 4.0.0beta\n[mms] Added virtual folder support.\n[mms] Allow all messages in an entire folder to be marked as seen or unseen.\n[mms] Allow attaching files from local VFS filesystems.\n[mms] Allow quick and easy access to unsubscribed folders on the search screen.\n[jan] Add quota driver for Mercury/32 servers (Frank Lupo <frank_lupo@email.it>).\n[mms] Add support for Message Disposition Notifications (RFC 2298).\n[jan] Dynamically add new attachment fields if all are used.\n[jan] Add special black-on-white styles for message printing.\n[mms] Added preference that allows user to strip attachment information for messages saved in the sent-mail folder after composing a message.\n[mms] Improve message threading display in the mailbox screen.\n[jan] Add Persian (Western) translation (Vahid Ghafarpour <vahid@ghafarpour.com>).\n[cjh] Allow quoted parts of messages to get hidden.\n[mms] Add messages thread view.\n[jan] Allow navigation through mailbox pages with left and right keys.\n[jan] Allow purging of multiple folders in the folders view (Todd Merritt <tmerritt@email.arizona.edu>).\n[jan] Allow turning off of the links to alternative parts in multipart/alternative messages.\n[cjh] Hide unnecessary UI elements when there's only one address book (Francois Marier <francois@nit.ca>).\n[cjh] Trap adding the same address multiple times in the Contacts window (Francois Marier <francois@nit.ca>).\n[cjh] Make the header checkbox on the folders page toggle selection of all folders (Francois Marier <francois@nit.ca>).\n[cjh] Add the basis for sending attachments as links to hosted files (Andrew Coleman <mercury@appisolutions.net>).\n[cjh] INBOX is now localized for display.\n[jan] Show warning when compose or passphrase popups are blocked by the browser.\n[mms] Allow which headers to view by default to be defined for each identity (Vijay Mahrra <vijay.mahrra@es.easynet.net>).\n[jan] Add mailbox management for supported servers like Cyrus.\n[cjh] Add option for reporting email as not spam (Liam Hoekenga <liamr@umich.edu>).\n[jon] Added a new preference that will cause a message to be spell checked before it is sent.\n[max] Add 'mail_domain' pref which overrides the server's maildomain setting.\n[mms] Added hooks for dynamic mailbox redirection and custom mailbox/folder icons on the folder page (Stuart Binge <s.binge@codefusion.co.za>).\n[mms] Use the MIME_Viewer system to generate 'previews' for composition attachments.\n"
4.0.0-alpha1:
  notes: "Original version string was 4.0.0alpha\n[mms] Added addressbook lookup and expand names feature to the redirect screen.\n[jon] Added the ability to create new tasks from received email messages.\n[mms] Rewrote fetchmail to use subclasses/drivers to do all the work - this allows support for accessing more mail server types in the future.\n[mms] When renaming folders, all subfolders below the folder being rennamed are now renamed also.\n[mms] Handle creation/display of RFC 2646 format text messages (flowed text).\n[mms] Rewrite of IMP_Tree code - now uses cache results for all folder and mailbox updates instead of requerying the server for the folder tree.\n[jan] Add Indonesian language (Slamin <slamin@unej.ac.id>).\n[jan] Add check if the user has selected but not yet uploaded attachments.\n[mms] Configuration option to disable Mail logging.\n[jan] Add preference to automatically save all recipients in the default address book.\n[mms] Use NLS:: hostname->country lookup to show country-of-origin for e-mail messages on the message screen.\n[mms] Support for auto-BCC addresses during compose for each identity (Nicholas Sushkin <nsushkin@users.sourceforge.net>).\n[mms] Support multiple file uploads on an individual compose page.\n[mms] HTML composed messages with image links now have the images downloaded and sent inline with the message in a multipart/related part.\n[jan] Show graphical emoticons.\n[mms] For images that cannot be viewed directly by the browser, IMP can automatically convert to a format that can be viewed.\n[cjh] Log reply/forward/redirect actions and display these logs when viewing the messages.\n[cjh] IMP now supports a hordeauth setting in servers.php, a la Gollem and other applications (Vijay Mahrra <vijay.mahrra@es.easynet.net>).\n[mms] Add on-demand generation of thumbnails for image attachments.\n[mms] Added 'Download All Attachments' link on message page to allow all attachments to be downloaded in a single zip file.\n[mms] Improved HTML to text conversion when replying/forwarding to a HTML message.\n[mms] Add 'tie to' ability to allow a specific identity to be explicitly tied to a message sent from a certain address.\n[mms] Maximum subject/from lengths, From: field link options, and mailbox time display formats are now user configurable preferences (Robert Ribnitz <ribnitz@linuxbourg.ch>).\n[jan] Add aliases to the user's identities to find messages sent to one of his identities but not directly to one of his email addresses.\n[mms] Preference to allow spam messages to be automatically deleted after reporting (Rudi Heitbaum <rudi@darx.com>).\n[mms] Moved IMP authentication code to Auth_imp::.\n[mms] Added configuration options allowing admin to limit (per message) both the total size of attachments and the number of attachments.\n[mms] Added preference allowing user to choose where to start browsing in a mailbox when first opening the mailbox.\n[mms] The guts of the IMP filtering code has been removed and ported to 'ingo'. Thus, filtering is now handled via Horde API calls instead of internally.\n[mms] The IMP search page now handles NOT searches, as well as basic AND/OR searches via the IMAP_Search:: library.\n[cjh] Add shift-click selection/deselection of ranges of messages (Andrew Johnson <horde@lastaccess.com>).\n[mms] Allow caching of folder list generation.\n[mms] Added IMP_IMAP:: class to handle IMAP/POP3 connections.\n[jan] Allow spam reporting from the mailbox view (Ahmed <ashihab@alcahest.com>).\n[jan] Add preference to store drafts marked unseen (Ahmed <ashihab@alcahest.com>).\n[cjh] The last_login preference is now entirely handled by Horde.\n[jan] Let the users select the message's charset while they are composing a message.\n[cjh] When a user's session times out while they are composing a message, give them a special login screen which displays the message and allows them to log in again to resume their message with all data intact.\n[cjh] Remove javascript refresh popups in the compose window.\n[mms] Allow display of uuencoded attachments.\n[cjh] Add flag-setting options on the message view (Dan Wilson <dan@acucore.com>).\n[mms] Allow blocking of images in HTML messages by default (Amith Varghese <amith@xalan.com>).\n[mms] Support for showing mail previews in javascript 'tooltips'.\n[mms] Added message/partial MIME_Viewer.\n[cjh] Add whitelist links to the mailbox view (Amith Varghese <amith@xalan.com>).\n[jan] Make fetchmail on login a maintenance task (Nuno Loureiro <nuno@co.sapo.pt>).\n[mms] Add VFS garbage collection for temporary attachment data.\n[mms] Add a default encryption preference for sending messages.\n[mms] Add 'Nuke Message' action to filters.\n[mms] Add quick search links to search the current mailbox.\n[mms] Scan messages for X-Priority and display results in the mailbox view (Florent AIDE <faide@alphacent.com>).\n[mms] Allow quicker access to large mailboxes on slower IMAP systems.\n[mms] Added multipart/appledouble MIME_Viewer.\n[jan] Add preference that lets users change the access control lists of their imap folders (Chris Hastie <lists@oak-wood.co.uk>).\n[mms] Split return receipt requests into 'delivered' and 'read' options (Ryan Malloy <rmalloy@meridianschools.org>).\n[mms] Implement fetchmail on login and fetchmail coloring to distinguish between remote servers (Nuno Loureiro <nuno@co.sapo.pt>).\n[mms] User configurable attribution text for replies (Chris Hastie <lists@oak-wood.co.uk>).\n[mms] Added support for message/disposition-notification messages.\n[jan] Folder names in any encoding can now be created/read through PHP's multibyte support.\n[mms] The \"Reply\" link for list messages will always send a message to the original poster, never the list (Chris Hastie <lists@oak-wood.co.uk>).\n[mms] Don't show \"Reply All\" link if user is the only recipient.\n[mms] Added a multipart/report MIME_Viewer to make undelivered mail reports easier to read.\n[jan] Add Turkish translation (Genco Yilmaz <gencoyilmaz@yahoo.com>).\n[mms] Convert IMP_Folder:: into an OO-interface.\n[mms] Allow attachment descriptions to be altered (Cliff Green <green@UMDNJ.EDU>).\n[mms] Set the local character set for all text/* composed messages.\n[mms] The full MIME_Contents:: object is now cached when viewing a message rather than the individual MIME_Parts.\n[jan] Add UTF-8 support. Any content with any charset can now be displayed with any translation.\n[cjh] The mail/compose method is now a full call, not a link. This means, aside from a bit less code duplication, that we now honor the compose_popup preference in $registry calls.\n[mms] Added hostname to information saved about user's last login.\n[mms] Added support for stripping attachments from messages.\n[mms] Better determination of MIME content-type for attachments when browser does not send good information (using MIME_Magic::).\n[mms] PGP messages are now rendered via the MIME embedded in the message.\n[mms] Move composition related functions to IMP_Compose::.\n[mms] Now, when reaching the end of the mailbox in the message screen, directly load the mailbox script instead of redirecting via a URL.\n[mms] Allow user to change disposition type of all attachments.\n[jan] Add a preference to display message previews in the mailbox view (Stephen Sherlock <stevesherlock@es-net.co.uk>).\n[cjh] Add a preference for whether or not to display the entire addressbook when first loading the contacts screen (Etienne Goyer <etienne.goyer@linuxquebec.com>).\n[ejr] Add command line driver for quotas.\n[mms] Allow multiple messages to be forwarded as rfc822 parts from the mailbox screen.\n[jan] Add logfile driver for quotas (Tim Gorter <email@teletechnics.com>).\n[cjh] Add searching by Bcc header.\n[mir] Add hook option to filter mail fetched by the Accounts (lib/Fetchmail) feature.  Example added in horde/config/hooks.php.dist\n[cjh] Migrate to the new hooks API, removing the last need for conf.php.dist (instead of conf.xml).\n[mac] Add S/MIME support.\n[avsm] Folders action bar only shows up at bottom if more than ten folders are displayed on the screen.\n[cjh] All hook functions that set preferences are now handled by the generic preferences hook system; see horde/config/hooks.php.dist.\n[mac] Don't modify the actual field name on auto-expand.\n[mms] Created an IMP_Mailbox:: class to deal with building mailbox information and, eventually, all message indexing.\n[mac] Quota display now handled by the IMP_Quota API.\n[mms] Can now filter by any header.\n[cjh] Clean up the filter_on_login code, so that it is _always_ run on login.\n[mac] Added an IMP specific ZIP MIME_Viewer.\n[cjh] Use new &Identity::singleton() method and application-specific driver implementations to load IMP's Identity_imp:: class.\n[mms] Moved IMP session creation functions to IMP_Session::.\n[mms] Added an IMP_Search:: class to handle mailbox searching.\n[mms] Message sending now handled by IMP::sendMessage().\n[mms] Move text filtering to IMP:: class.\n[mms] Added an IMP_Filter:: class to handle all filtering activity.\n[mms] Spam reporting sends a message in message/rfc822 format.\n[mms] Allow the users PGP public key to be uploaded to a keyserver.\n[mms] The compose script makes sure to clean up all attachment files that are generated during a message composition. even if cancelled.\n[mms] Attachment disposition can now be set to either inline or attachment.\n[mms] Improved handling of attachment data.\n[mms] Added the multipart/related viewer.\n[mms] Moved the message index tracking mechanism in the message.php script to IMP_Message::.\n[cjh] Add an option (preference controlled) to use IE's designmode and send multipart/alternative messages.\n[jan] Use a seperate textarea field for blacklisted email addresses in the filters preference.\n[mms] Add an option to allow for header summaries to be inserted when replying to a message (Quinn Wilson <qwilson@midworld.org>).\n[mms] Created an IMP_Headers:: class to deal with all header manipulation required in IMP.\n[mms] Added a generic multipart/* MIME_Viewer.\n[mms] Added a multipart/alternative MIME_Viewer.\n[mms] Moved all common functions dealing with displaying the content of mail messages to lib/Contents.php.\n[cjh] Add an option to see a confirmation that messages were succesfully sent.\n[cjh] Add option to delete fetched messages when using the fetchmail code.\n[mms] Added application/ms-tnef MIME_Viewer.\n[mms] Search for PGP public keys on a public keyserver for signed messages if no key found locally.\n[mms] Can now send messages with \"X-Priority\" set.\n[mms] Add option to search for PGP data in 'text/plain' messages.\n[mms] Add \"Show All/Limited Headers\" to message view.\n[jan] Add fetchmail feature (Nuno Loureiro <nuno@co.eth.pt>).\n[mms] Added MIME_Viewer to allow attached images to be viewed inline.\n[mms] Add link for \"Reply to List\" for mailing lists.\n[mms] Now recognize RFC 2369 headers (messages from mailing lists) and output the relevant information.\n[mms] Add message/rfc822 MIME_Viewer.\n[jon] Set the username and password parameters when SMTP authentication is requested.\n[mms] Handle the new behavior of MIME_Structure::parse().\n[mms] Add OpenPGP functionality.\n[ejr] Add text/enriched MIME_Viewer.\n[cjh] If the server list is being used, users shouldn't be changing the folder prefix.\n[max] Add Brown IMP theme (Marco Obaid <marco@muw.edu>)\n[cjh] Make it possible to call IMP::authenticate() with arguments coming from somewhere other than GET or POST vars.\n[jan] Re-enable to select no sent mail folder for an identity.\n[jan] Add method IMP::stripPreambleString().\n[jan] Fix problems with sent mail folder maintenance not being executed.\n[cjh] Fix problems with the mailbox displayed after login if there is a folders prefix set.\n[cjh] Use the new PrefsUI class.\n[cjh] Revert to not storing the folder prefix as part of user preferences.\n[cjh] Fix problems with double Last Login: message and maintenance.\n[jon] Adapt to the new Horde::img() syntax.\n[cjh] Use the new Notification system.\n[jan] Remove the standard value for the language preference. The language to fall back to should be set Horde wide in lang.php instead.\n[jon] Honor the \"save sent mail\" checkbox on the compose screen.\n[jon] Print the language type in the <html> entity.\n[jon] Add <link> entity support.\n[jon] Add <link> support to the mailbox and message views.\n[mms] Move the quote prefix character from conf.php to the preferences.\n[mms] Move the maintenace framework to Horde.\n"
3.2.8:
  notes: "[jan] Close XSS when setting the parent frame's page title by javascript (cjh).\n[mms] Fix display of MIME parts less than 1K when local number format uses ',' as the decimal separator.\n[jan] Don't use trash folder on POP3 servers under certain circumstances (Bug #1373).\n[jan] Fix \"Save as\" link to save message sources (Bug #1233).\n"
3.2.7:
  notes: "[mms] Determine the default IMAP delimiter according to RFC 3501.\n[mms] Fix the folders screen hanging if there was only one folder (Bug #504).\n[jan] Correctly cancel messages composition in all cases (Rich Bartell <rwb@bartellonline.com).\n[mms] Don't convert colons in user-defined headers to underscores (Bug #676).\n[jan] Don't blacklist already blacklisted addresses again (Bug #530).\n"
3.2.6:
  notes: "[jan] SECURITY: Remove tags with -moz-binding: styles in the HTML MIME viewer.\n[cjh] SECURITY: Remove scripts from <base> tags in the HTML MIME viewer.\n[jan] SECURITY: Remove scripts from obfuscated \"on...\" attributes in the HTML MIME viewer.\n"
3.2.5:
  notes: "[jan] SECURITY: Close an XSS hole in the HTML viewer, a variation to the one reported in http://www.greymagic.com/security/advisories/gm005-mc/.\n[cjh] Fix escaped double quotes on some broken mail servers (Bug #292).\n[jan] Comment complete <style> tags out in the HTML viewer to avoid CSS code appearing in the message.\n"
3.2.4:
  notes: "[cjh] SECURITY: Close an XSS hole exploited via the Content-type header of malicious emails.\n[jan] Fix conversion of folder names in some non-ascii charsets with buggy iconv implementations (Wenzhuo Zhang <wenzhuo@zhmail.com>).\n[jan] Filter out <base> tags when viewing HTML messages (Bug #10).\n[mms] Encode subject when saving as draft (Tero Matinlassi <tero.matinlassi@edu.vantaa.fi>).\n"
3.2.3:
  notes: "[jan] Fix the 'undefined index direct_access' error still occuring in obscure cases.\n[jan] Add Indonesian language (Slamin <slamin@unej.ac.id>).\n[jan] <style> and <link> tags get commented out in HTML messages to not allow them breaking the page layout.\n[jan] Add Galician translation (Rafael Varela Pet <srrafa@usc.es>, Guillermo Mendez <guille@usc.es>).\n[jan] Remove HTML tags showing up in some error messages.\n[mms] The spell check feature now keeps lines wrapped and correctly handles apostrophes in words on all architectures.\n"
3.2.2:
  notes: "[mms] XSS vulnerabilities in the HTML viewer fixed (Ulf Harnhammar <ulf@update.uu.se>).\n[jan] Add Arabic (Syria) translation (Platinum Development Team <devteam@platinum-sy.net>).\n[jan] Add Arabic (Oman) translation (Said Al-Hosni <admin@wabhosting.com>).\n[jan] Add Macedonian translation (Stojan Pesov <ssp@eureka.com.mk>).\n[jon] Allow the spam reporting system to also use an external program.\n[jan] Add IMP::rfc822WriteAddress() as a replacement for the buggy imap_rfc822_write_address() function.\n[jan] Add Thai translation (Surasak Srisawan <surasak@rirc.ac.th>).\n[jan] Add Icelandic translation (Bjorn Davidsson <bjossi@snerpa.is>).\n[mms] Correct display of filter rules with \"special\" HTML characters.\n"
3.2.1:
  notes: "[mms] Search results page fixed to correctly link to message compose if from_link set to 'compose'.\n[mms] Cancel now works correctly on the redirect screen when not composing in a new window.\n[jan] Fix an 'undefined index direct_access' error for first time users in conjunction with Horde 2.1.\n[mms] Don't show popup new mail windows on login.\n[jan] Fix bug causing some MIME parts to not be displayed correctly.\n"
3.2.0:
  notes: "[jan] Add Catalan translation (Angels Guimerà <angels.Guimera@uab.es>).\n[mms] Check for invalid 8bit characters in email addresses.\n[mms] Improved download links that handles various browser quirks much better than before.\n[mms] Workaround for multipart/form-data and IE 6+ browsers on the compose page.\n[mms] Do not allow the '\\' character in full names (see RFC 2822 [3.2.5]).\n[jan] Add IMP::utf7[En|De]code() methods that allow not only iso-8859-1 encoded folder names but every name in the charset of the current language.\n[mms] Check for invalid character sets when parsing text/plain messages.\n[mms] Allow filter on refresh from IMP summary view.\n[jan] Fix attachment downloads with Opera.\n[jan] Add Latvian translation (Kaspars Kapenieks <kaspars@rcc.lv>).\n[mms] Don't show addressbook icon for e-mail addresses on print screen.\n[jan] Add Romanian translation (Corneliu MUSAT <cmusat@tiamat.keysys.ro>).\n[cjh] Close several small XSS vulnerabilities (Mitja Kolsek <mitja.kolsek@acros.si>).\n[jan] Fix attachment downloads with IE over https (Leena Heino <Leena.Heino@uta.fi>).\n[cjh] Add an option to use a VFS for attachment storage if an appropriate Horde version (2.2 or later) is installed.\n[cjh] Add an option to display a confirmation of sending messages, if you are not using a pop-up compose window.\n[jon] The spam reporting link now sends the complete message body, not just the first 10k.\n[mac] Add the ability to move/copy messages to a new folder.\n[jan] Show timeout warning if session is about to expire.\n[jan] Add IMP::addParameter().\n[jan] Add Lithuanian translation (Darius Matuliauskas <darius@lnk.lt>).\n[jan] Add Bulgarian translation (Miroslav Pendev <pendev@hotmail.com>).\n[mms] Received header generation now compliant to the pseudo-standard defined in RFC 2181.\n[cjh] User preferences, unless locked, override the from and fullname hooks.\n[mms] Added images MIME_Viewer.\n[mms] Invalid addresses identified by the c-client library are now handled more cleanly.\n[mms] Search results were not always working with all features - this has been fixed (Geoff Hort <g.hort@unsw.edu.au>).\n"
3.1.0:
  notes: "[jan] Add Hungarian translation (Laszlo L. Tornoci <torlasz@xenia.sote.hu>).\n[cjh] Clean up the Empty Trash action, and return you to the screen you were on when you clicked the menu item.\n[jan] Use SMTP authentication if $conf['mailer']['params']['auth'] in horde/config/horde.php is set.\n[jan] Add IMP::prepareMailerHeaders().\n[jan] Add Norwegian Nynorsk translation (Per-Stian Vatne <psv@orsta.org>).\n[jan] Add Slovenian translation (Jure Krasovic <jurek@rcc-irc.si>).\n[cjh] Add an option for allowing resuming of all messages in the Drafts folder (Liam Hoekenga <liamr@umich.edu>).\n[cjh] Fix problems with javascript, IE, and # in folder names.\n[mir] Add Empty Trash menu item.\n[mir] Add option to empty a mailbox on the folders screen.\n[jan] Add Japanese translation (B.J. Black <william.black@sun.com>).\n[cjh] Protect against modified login forms.\n[mir] Add preferences to control quote and signature highlighting.\n[cjh] Don't make the user select an addressbook if there's just one in the contacts interface.\n[cjh] Close a potential problem with register_globals On and $js_onLoad.\n[cjh] Add do_maintenance preference (Julian Jares <julian@jares.com.ar>).\n[cjh] Fix errors when there are no subscribed folders.\n[cjh] Fix a problem with sorting by thread, POP3, and deleting messages.\n[cjh] Fix IMP summary with POP3 if the user polls folders other than INBOX.\n[cjh] Change to lib/Tree.php that fixes folder problems for some Cyrus users (David Kerry <imp@snti.com>).\n[cjh] Add constants.php so that the SORTTHREAD constant can be used in config/prefs.php.\n[jon] Make displaying the mailbox legend a personal preference.\n[cjh] Add compose link to the summary (Quinn Wilson <qwilson@midworld.org>).\n[cjh] Improve the LOGIN_COMPOSE functionality to pass along To:, Cc:, etc.\n[mir] Add addressbook interface popup to the compose window.\n[mac] Add sort-by-thread.\n[jon] Add <link> entity support.\n[cjh] Simplify a lot of the spelling logic and fix problems with the Change All option.\n[cjh] Use Horde::getFormData() in folders.php and fix problems with folder names involving quotes.\n[cjh] Fix IMP_Folder::exists() for names with wildcards in them.\n[cjh] Fix a problem with passwords that end or begin with spaces.\n[cjh] Prefix lines passed to ispell with a '^'.\n[jan] Add preference that selects the view or mailbox to display after login.\n[cjh] Don't imap_utf7_decode() folders until they are displayed to the user; always pass around and store encoded values.\n[cjh] Don't call session_start() again in login.php.\n[cjh] Get rid of the server_list_hidden option and change the server_list option to be either 'shown', 'hidden', or 'none'.\n[cjh] Set the align To:, Cc:, and Bcc: label cells to top.\n[jan] Remove the 'folders' preference in favour of a new 'change_folder' configuration that sets if a folders field is displayed on login.\n[cjh] Remove the \"or: \" from box in the compose screen if identities are being used.\n[cjh] Fix a problem with folder prefixes beginning with a '.' and show_dotfiles set to false.\n[jan] Add preference: include message in reply (Ramon Kagan <rkagan@yorku.ca>).\n[cjh] Fix the printing javascript.\n[jan] Add Estonian translation (Toomas Aas <toomas.aas@raad.tartu.ee>).\n[cjh] Trim long subjects in the message screen header so that navigation elements remain in a consistent place from message to message.\n[jan] Add Slovak translation (Leo Mrafko <leo@oel.sk>).\n[jan] Fix shifting of selected checkboxes if cookies are disabled.\n[cjh] Fix lots of folder issues and get rid of unnecessary urlencoding().\n[cjh] Make the folder navigator work with additional folder hierarchies (such as UW's #shared/).\n[jan] Include print functions and error handling only in the print window to prevent \"Your browser does not support this print option\" messages.\n[cjh] Add rfc822_explode() to handle exploding of addresses ignoring quoted or escaped commas - e.g., \"Lastname, Firstname\" <address@example.com>.\n[cjh] Folder names need to be urlencoded in compose links so that folder names with '#' and other characters in them - like UW's #shared/ hierarchy - work correctly.\n[cjh] Make sure $conf['server']['show_dotfiles'] is honored by the folders screen as well as by the drop-down lists.\n[cjh] Switch output compression to ob_gzhandler().\n[cjh] Use IMP_TEMPLATES constant for all template paths.\n[cjh] Use $registry->get() for all Registry information.\n[cjh] Get rid of unnecessary IMP_NAME constant.\n[jan] Add Portugues translation (Nuno Loureiro <nuno@eth.pt>).\n[jan] Fix bug with maintenance and login to the framework.\n[jan] Fix problems with folder names that contain special characters.\n[jan] Fix spell checking to work with the changed str_tok() behaviour.\n[jan] Add mailbox action \"Empty Trash folder\".\n[jan] Add Date: header when saving a draft.\n[jan] Move the form variable handling from the libraries to the pages.\n[jan] Show a more detailed error message if sending a message fails. (Michael Redinger <Michael.Redinger@uibk.ac.at>)\n[jan] Escape login data correctly.\n[jan] Preselect correct identity when resuming drafts.\n[jan] Fix bug if IMP doesn't \"remember\" the trash folder in the preferences.\n[jan] Preferences are now consistently called options in the whole ui.\n[jan] Add comments for search_sources and search_fields preferences.\n[jan] Fix bug in the maintenance section if IMP is not in the default directory.\n[jan] Add Danish translation (Martin List-Petersen <martin@list-petersen.dk>).\n[jan] Keep the state of all form elements in the compose window during page reloads (expanding name, spell checking).\n"
3.0.0:
  notes: "[jan] Use the 'use_trash' preference instead of the 'expunge_on_move' configuration to decide if we have to expunge the folders.\n[avsm] Add .htaccess files to deny access to data directories.\n[jan] Add Swedish translation (Andreas Dahlén <andreas@dahlen.ws>).\n[jan] Add Finnish translation (Leena Heino <liinu@uta.fi>).\n[cjh] Re-add Save As feature.\n[jan] Add Swedish translation (Andreas Dahlén <andreas@dahlen.ws>).\n[cjh] Fix problems when $prefix or $namespace is also a substring within folder names.\n"
3.0.0-RC4:
  notes: "Original version string was 3.0.0RC4\n[rich] Include rewritten and reorganized documentation.\n[jan] Add preferences: close window after saving draft, quote prefix.\n[jan] Add comments on how to use the quota hook with Courier (Joshua E Warchol <jwarchol@dsl.net>).\n[avsm] Disable monthly maintainance operations by default.\n[bjn] Change 'en' and 'en_EN' locales to 'en_US' (default).\n[cjh] Fix first page calculation.\n"
3.0.0-RC3:
  notes: "Original version string was 3.0.0RC3\n[cjh] Remove onclick events in the mailbox view for consistency and simplicity.\n[cjh] Better error reporting when an attachment upload fails.\n[cjh] If a text part is in a different character set, try displaying it inline, but give the user a link to open it in a new window.\n[cjh] Filter out iframes and meta tags in HTML attachments.\n[cjh] Check to see if sent-mail-mth-year already exists, and give a warning, instead of failing the rename, if it does.\n[mms] Add new preference to display if any filters have been applied to any message.\n"
3.0.0-RC1:
  notes: "Original version string was 3.0.0RC1\n[jan] Add Greek translation (Stefanos I. Dimitriou <sdimitri@teiath.gr>).\n[jan] Add Korean translation (J.I Kim <aporie@netian.com>).\n"
2.3.7:
  notes: "[jon] Rename the 'append_header' configuration variable to 'prepend_header'.\n[cjh] Use \"redirect\" instead of \"bounce\".\n[cjh] Introduce an Identity_IMP subclass to hide all of the IMP-specific hooks and utility functions.\n[cjh] Highlight messages in the mailbox view as they are moused over (Alex Leverington <admin@networkessence.net>).\n[cjh] Leave session_start() to the Registry.\n[cjh] Let the Registry handle retrieving preferences.\n[cjh] If using a language that needs it, allow selection of the charset to view messages in (<anton@valuehost.ru>).\n[jan] Extend 'nav_expanded' preference: Expand folders like they were the last time.\n[jan] Move all the identity stuff into a seperate class and add sent-mail options to the identities.\n[cjh] Fix changing identities after using Expand Names.\n[cjh] Make the textareas for signature and message body use the width set in the user's preferences.\n[cjh] Fix Bounce, Move, and Copy from within a search results set.\n[cjh] IMP now uses Horde::logMessage() for all logging activity.\n[jan] Rename sent-mail folder based on the old name and recreate sent-mail folder after renaming during the maintenance tasks.\n[jan] Add selection fields after expanding names on Cc: and Bcc:\n[cjh] Remove the 'mailhost' and associated preferences, and add $conf['server']['change_<foo>'] switches so allow control of the login screen.\n[jan] Add Russian translation (Anton Nekhoroshih <anton@valuehost.ru>).\n[jan] Add a new field after expending names to allow adding more addresses.\n[max] Add several search criteria to and change the UI of the search screen.\n[jan] Add Italian translation (Giovanni Meneghetti <gmeneghetti@infvic.it>).\n[mms] Add maintenance operations.\n[cjh] Add French help file.\n[jan] Add select field if \"expand names\" returns more than one matching name/address.\n[jan] Choose correct identity if replying to, forwarding or resuming a message.\n[jan] Add Polish translation.\n[jan] Show personal flag for all identities.\n[jan] Add support for identities to the compose window.\n[cjh] Handle a couple of cases where the mailbox in the session has changed more gracefully.\n[jan] Add French translation (Frederic Trudeau <ftrudeau@CAM.ORG>).\n[cjh] Fix spam reports, and give the user an error message letting them know that the message was successfully reported.\n[cjh] Add Czech translation (pchytil@asp.ogi.edu).\n[jan] Add new timezone handling with select box in prefs.\n[cjh] Handle moving messages correctly when Hide Deleted is on.\n[cjh] Add blacklisting capability (generates filters to block senders).\n[avsm] The \"not configured\" page no longer depends on Horde.\n[cjh] Tweak the message UI a bit.\n[avsm] Replace $conf['paths'] with the $registry equivalents.\n[avsm] Switch IMP over to the Horde MIME_Viewer framework.\n[avsm] Identity editing now allows switching between create/edit mode.\n[cjh] Add quota hook (Marc Jauvin <marc@register4less.com>).\n[cjh] Use onclick=\"\" for the javascript that opens attachment windows.\n[cjh] Support printing in older browsers through VBScript.\n[cjh] Add $HTTP_HOST based virtual hosting hooks (Marc Jauvin <marc@register4less.com>).\n[cjh] Catch a few more sneaky things in the html sanitizing regexps.\n[cjh] Make sure to encode 8-bit recipients.\n[cjh] Make the folder tree more robust in dealing with folder prefixes.\n[cjh] Add a signature hook to dynamically set part or all of a user's signature (Marc Jauvin <marc@register4less.com>).\n[jon] Changed $conf['hooks']['from_hook'] to $conf['hooks']['from'].  It now accepts a function name for a value.\n[cjh] Clear the whole session when the user logs out and IMP is the Horde auth controlller.\n[jon] Added support for an optional 'smtphost' $servers parameter.\n[cjh] Use the *url() functions more consistently to make sure that cookie-less sessions work.\n[cjh] Add Simplified Chinese translation (WangHengWen <whw@my169.com).\n[jon] Renamed the 'delete_return' user preference to 'mailbox_return'.\n[jon] Honor the 'delete_return' preference after moving and copying messages.\n[cjh] Don't display the folder prefix in the folder tree (Egan <egan@sevenkings.net>).\n[cjh] Add $conf['menu']['apps'] to add links to other Horde applications in the menu bar.\n[cjh] Allow for prompts in the server list (entries whose keys begin with '_') and clean up some of the server list/login logic.\n[cjh] Fix the LOGIN_COMPOSE action.\n[cjh] Use imap_fetch_overview() to build the mailbox index. Should be a lot nicer to the IMAP server.\n[cjh] Sort the folder drop-down with a natural-order algorithm, case insensitive, to match the folders screen.\n[cjh] Add UI for folder download.\n[cjh] Use prefs.gif and generic prefs templates from Horde.\n[cjh] Don't wrap forwarded messages; they should be already wrapped.\n[cjh] Add actual Spanish translation (Raul Alvarez Venegas <rav@tecoman.ucol.mx>).\n[jan] Allow opening folders with new mail from the notification popup.\n[jon] Merge doctype.inc into common-header.inc.\n[cjh] Use is_uploaded_file() and Horde temp file routines to make sure that uploaded files are valid and are stored in random temp file names.\n[jon] Allow the registry to handle IMP's configuration values.\n[jon] HORDE_BASE is now defined in lib/base.php instead of config/conf.php.\n[max] Add search and add addressbook user preferences.\n[jon] Add Dutch translation from Jan Kuipers <jrkuipers@lauwerscollege.nl>.\n[jon] Add a new user preference to determine whether a user is returned to the mailbox listing after a message is deleted.\n[max] Add powerpoint-viewer.\n[jon] Add a time zone user preference.  It is only used for outbound messages.\n[jon] Make the text wrapping width configurable on a per-user basis.\n[cjh] Add French translation (Christophe Ruelle <ruelle@echo.fr>).\n[cjh] Clean up the spelling code, fixing some problems with form data, multiple htmlspecialchars() calls, and losing text when finishing the spell check.\n[cjh] Make whether or not to use a trash folder a user preference.\n[cjh] Check for undefined 'size' attribute of attachments; normally indicates that the file was too large to be uploaded sucessfully.\n[cjh] Show KB for attachments in the compose window, instead of bytes.\n[jon] Cleanup preferences upon logout.\n[cjh] Add Brazilian Portuguese translation (hostmaster@sbs.srv.br).\n[cjh] Add new mail popup (if the pref is enabled) in the mailbox view (Nick Ustinov <Nick.Ustinov@videinfra.lv>).\n[max] Add the realm field to make logins unique on multi-server configurations for preferences and authentication.\n[max] Allow IMP to be an authentication handler for Horde.\n[cjh] Define the HORDE_BASE constant in config/conf.php, and use it when referring to any of Horde's files.\n[max] Remove connection tracking, made obsolete by redirect.php.\n[cjh] Handle multipart/alternative correctly.\n[jon] Don't print the Bcc: list in the viewable message headers.\n[jon] Retired config/menu.txt in favor of config/menu.php.  This file follows a new format based on native PHP data structures.\n[jon] Changed compose.php's caching to 'private, must-revalidate' for Netscape.\n[max] Use Horde's raiseMessage on compose screen.\n[jon] Use Horde's temporary file routines.\n[max] Use the new Registry:: framework to add addresses to Turba.\n[cjh] Allow purging of deleted messages from search results.\n[cjh] Use the new Registry:: framework to expand addresses from Turba addressbooks (or anything else that implements the contacts/expand API).\n[cjh] Fix some problems with mailto: generated links, support mailto:address?subject=foo, etc., and make compose message mouseovers more consistent in all parts of the UI.\n[cjh] Rename MOTD.html to motd.php, and move to a .dist file.\n[cjh] Re-added onchange javascript for the menu select, but with a javascript guard to avoid repeated page loads when accidentally scrolling through with a wheel mouse.\n[jon] Fixed In-reply-to: and References: headers.  Reply threading works again.\n[cjh] Remove password changing code; it belongs in Gollem.\n[cjh] Convert tabs in text parts to 8 spaces for proper display.\n[cjh] Fix deletion/undeletion of messages in search results from message view.\n[cjh] Fix first new message detection, hopefully for real this time.\n[cjh] Visual tweaks to the folder tree to make things line up better.\n[cjh] Sort search results according to preferences.\n[cjh] Rename get_from() to getFromAddress(), and clean up the logic so that if users are allowed to change their addresses or fullnames, they can do them on a one-time basis by editing the From: line in the compose screen.\n[jon] Retired $conf['user']['allow_filters'].  Administratively locking the 'filters' preference produces the same behavior.\n[cjh] $conf['user']['allow_directory_search'] is gone; we now just check and see if a contact manager is registered with Horde, and link to it if it is.\n[cjh] Nuke almost all <font> tags\n[cjh] Fix all checks against the protocol to use strstr, so they work against either imap or imap/ssl and pop3 or pop3/ssl.\n[cjh] Simplify a bit of the MIME stuff - go off of the Content-Disposition of parts most of the time, with just an option to never show parts inline in the conf file. Also, remove the override_text option, and a few other cleanups.\n[cjh] A few changes so that we can properly support the newly-working imap/ssl and pop3/ssl support in php.\n[jon] Updated preferences functions to match the new Horde preferences API.\n[cjh] Trim some unused javascript from the compose screen, and fix the IE subject field keypress hack.\n[cjh] Modify the default mime.php configuration so that things like icons are assigned to file types even if we don't have a viewer for that file type.\n[cjh] Allow '+' to terminate URLs.\n[cjh] The preferences GUI is now built almost entirely on the fly, with only a few bits that are specific to IMP.\n[cjh] Fix an infinite loop with invalid folder prefixes in the folder view.\n[cjh] Reorganize the preferences into multiple, small screens. Change password and Filters are both accessible through the options screen now.\n[cjh] Close a hole in the html attachment cleaning code.\n[cjh] Fix spam reporting to use the new MIME api.\n[cjh] Use array_slice() instead of a for loop in IMP_Message::range().\n[cjh] Use message lists and FT_UID when deleting/undeleting messages.\n[cjh] Safeguards against errors if a message does not exist or is incorrectly requested.\n[cjh] $conf['server']['to_domain'] is now gone, along with $servers['foo']['to_host'], $servers['foo']['from_host'], and the maildomain prefs value. These are all now represented by $servers['foo']['maildomain']. Update your configurations accordingly.\n[cjh] $conf['server']['namespace'] is gone, in favor of the use of $servers['foo']['namespace'].\n[max] Allow selecting multiple fields in filters.\n[cjh] When fetching a mime part from the ObjectStore fails, correctly fall back and parse the message to find it.\n[cjh] When resuming or forwarding messages with attachments, don't duplicate parts.\n[cjh] Everything in lib/IMP.php now lives inside the IMP:: class, and the phpdoc documentation is up to spec.\n[cjh] Define an IMP_BASE constant used wherever including files to make sure that files are included relative to where IMP is in the filesystem. This allows IMP scripts to be included from other scripts in completely different hierarchies and still work.\n[jon] Make sure ./config/trailer.txt is readable before we try to use it.\n[cjh] Fix a couple of problems with imap subscriptions and utf7-encoded mailbox names.\n[cjh] Move IMP_Folder::displayName() to IMP_Util::displayFolder(), as it is used in places that don't use the rest of the folders code.\n[cjh] The login form now posts to redirect.php (renamed from remote_login.php) so as to avoid posting directly to the mailbox page. This avoids some problems with \"Page Expired\" errors.\n"
2.3.6:
  notes: "[jon] Added $conf['compose']['allow_receipts'] to control whether a user can request a return receipt from the compose screen.\n[cjh] Revamp the attachment downloading code. At the moment, it works with every browser I can test.\n[max] Make IMP XHTML 1.0 compliant.\n[cjh] Pass the results of get_barefrom() to the problem reporting page as the email address to use.\n[cjh] Move navigator.php to folders.php.\n[max] Add number of words per spelling screen user preference and bring spelling up to horde coding standard.\n[cjh] Make IMP work with register_globals = Off and magic_quotes_gpc = On. (IN PROGRESS)\n[avsm] Move navigator refreshing to a user-preference, and apply it to the mailbox view as well.\n[cjh] Fix viewing HTML messages with inline images.\n[cjh] Add IMP::partSummary() (formerly mime_summary()) since it is IMP-specific.\n[cjh] Add the ability to search by To: field.\n[cjh] Add Horde::raiseMessage() error reporting to the IMP_message:: class.\n[cjh] Allow creation of top-level folders in navigator.php.\n[max] Move javascript functions on the filters screen to the beginning of the page.\n[avsm] Allow a user-defined set of folders to be polled for new mail in the navigator\n[jon] Make inline email addresses into compose links.\n[jon] Added $conf['user']['allow_resume_all'].  Unless it's true, only messages marked as 'drafts' can be resumed.\n[avsm] Add 'subscribe/unsubscribe' to the actions list in the navigator\n[avsm] When using subscribe mode, show a toggle in the navigator to allow the user to view unsubscribed folders also.\n[cjh] Remove NNTP support for now since it's not really functional, and we have Troll.\n[cjh] Add imap/ssl as a protocol option.\n[cjh] Add javascript to the preferences screen to let users create new folders for sent-mail and drafts.\n[max] Javascript usability changes to the filters screen.\n[max] Add mail filtering rules functionality and the associated preferences.\n[cjh] Add IMP_Folder::displayName() and use it for any user messages.\n[cjh] Handle more options on search sets (replying, etc.) more gracefully.\n[cjh] Hide the folders prefix from the user in folder navigator javascript messages.\n[cjh] Remove the $preamble argument from IMP_Folder::rename().\n[cjh] Clean up trash folder functionality; it _should_ work now.\n[avsm] Add success messages for the create/rename/delete folder operations.\n[avsm] Convert the navigator to checkboxes to allow multiple operations.\n[cjh] Use the new Horde::raiseMessage() method in the IMP_Folder:: class, and display message and IMAP alerts right after the menu.\n[cjh] Use select lists to pick the sent-mail and drafts folders.\n[cjh] UI tweaks on the preferences screen, and use compression if it's enabled.\n[cjh] UI tweaks to the folder navigator to include actions at the bottom of the page as well.\n[cjh] Make use of new Registry:: features to not hardcode the path to compose.php in lib/js/open_compose_win.js.\n[cjh] Heavily commented config/conf.php.dist.\n[avsm] Make folder subscriptions a per-user preference, instead of global.\n[cjh] Encrypt passwords in session data, using a key stored in a cookie or mildly obscured from the session id and sitename setting.\n[cjh] Fix bouncing of messages.\n[cjh] Make searching work under pop3.\n[cjh] Attempt to provide better compose window tab behavior for MSIE (Max Kalika).\n[cjh] Use imap_utf7_encode|decode properly in the folder navigator.\n[jon] Cleanly handle the 'undisclosed-recipients' case.\n[jon] Consider a composed message valid if it has a To: field or a Cc: field or a Bcc: field defined.\n[jon] Re-introduced the 'sig_dashes' preference.  If enabled, the user's signature will be preceded with the standard courtesy dashes ('-- ').\n[jon] Added a 'sig_first' preference that will place the signature text above the message body in replies and forwards. (max@the-triumvirate.net)\n[cjh] Make sure to imap_utf7_encode() the sent-mail and drafts folders.\n[cjh] Fixed display of search results from multiple mailboxes.\n[cjh] Started to comment our config files more thoroughly.\n[cjh] Remove $conf['use_horde_auth'] from IMP 2.3.\n[cjh] Adjust the conf files, message.php (spam reports) and compose.php to use the PEAR Mail:: interface.\n[cjh] Fixed search.\n[cjh] Fixed select all/select none for pop3.\n[cjh] Cleaned up the paging logic a little bit and tweaked the descending sort code to hopefully fix a bug.\n[jon] Automatically set the focus to the username field on the login screen.\n[cjh] Use buttons for Next, Cancel, and Done in spellcheck, and change the name of the config option to $conf['utils']['spellchecker'].\n[cjh] When we delete a folder in the navigator, just splice that folder out of the tree instead of reinitializing everything.\n[cjh] Updates to the navigator to handle more situations - folder prefixes, etc. Seems to work well now with UW and Exchange, at least.\n[cjh] Remove fetchmail functionality until a later release.\n[cjh] Fix a bug when forwarding certain kinds of MIME messages.\n[cjh] When composing in the same window, carry information about where we are in the mailbox around so that we can return to the same place.\n[cjh] Fixed a silly bug in mime_view_text() that added ampersands to the beginning of some messages.\n[avsm] Add an 'Undelete' option to the message view, for deleted messages.\n[avsm] Shift Navigator UI around to bring it more in line with the rest of IMP.\n[jon] Don't display the 'Spell Check' link if $conf['utils']['ispell'] is empty.\n[cjh] Use the new optional argument to imap_sort (added to php4 2000-10-18) to implement the \"Hide Deleted\" functionality cleanly.\n[cjh] If a user is behind a proxy that provides an HTTP_X_FORWARDED_FOR variable, log it in the case of failed logins.\n[cjh] Allow selecting of personal/not personal messages, and define contants for all of the flags so that they're not hardcoded anywhere.\n[cjh] Add functionality to remote_login.php and mailbox.php to allow a user to go right to the compose window (or to pop one up) on login.\n[cjh] Forward-port the excel-viewing code from 2.2.\n[cjh] Make the wordview utility $conf['utils']['wordviewer'] to make it more program agnostic.\n[jon] Adding Help link to the menubar.\n[cjh] Decode MIME attachment filenames.\n[cjh] Tweak message saving to be more correct: Mathieu CLABAUT <mathieu.clabaut@free.fr>.\n[cjh] Moved the session and authentication functions inside IMP::.\n[cjh] Started using HTTP_POST_VARS, HTTP_GET_VARS, etc.\n[cjh] Added an option to use Max Kalika's Connection:: tracking class.\n[jon] Added a simple spam reporting mechanism ($conf['spam']['reporting']).\n[jon] Standardize on the rfcdate() function in lib/Horde.php.\n[jon] Changed some of the wording in the \"Change Flags:\" dropdown list.\n[cjh] Form-uniqifying javascript to prevent caching problems with spellcheck.\n[cjh] Inherit options from Horde, merging $horde into $conf.\n[cjh] Make use of the HTTP_Cache class, if $conf['compress_content'] is true.\n[cjh] Replace $conf['localhost'] with $HTTP_SERVER_VARS['SERVER_NAME'].\n[cjh] Use buttons for send message, save draft, and cancel.\n[jon] Message content filtering is now a user-specific preference.\n[cjh] respect the value of the TMPDIR environment variable in tmpdir().\n[cjh] view.php now checks for browsers which require downloads to be cacheable (like MSIE).\n[jon] Remove our address from the Cc: list when \"replying to all\".\n[jon] Move the filtering code around a bit and add a sample filter.txt.dist.\n[jon] Added some simple message content filtering options.\n[jon] Use the 'public' cache limiter for compose.php.\n[cjh] Add a received header for the hop from the browser to the web server.\n[cjh] Denote personal mail with an icon (what pine marks with '+') (Max Kalika <max@the-triumvirate.net>).\n[cjh] Protect us from possible file-reading exploits through file attachment.\n[jon] Silence session_start warnings.\n[avsm] Navigator control bar now has options to create/delete/rename folders\n[jon] Control of the compose window is now determined by the 'compose_popup' user preference.\n[jon] Replace buildURL() with Horde::url().\n[jon] Restructured the SQL preferences schema.\n[cjh] Use $horde['session_name'].\n[cjh] Session:: doesn't really buy us anything, so we've moved the utility methods that do into Horde::, and are just using php4 session calls elsewhere.\n[jon] Updated session functions to use Horde's new Session instances.\n[cjh] Add a mime function for viewing php code.\n[cjh] Added the beginnings of a fetch-mail-from-remote-server piece.\n[jon] Removed the last few references to the newuser code.\n[jon] Removed the MailServer class used in config/servers.php in favor of a hash-based system.  See config/servers.php.dist for examples.\n[avsm] Added $conf['navigator']['alert'] to support javascript alert popups\n[jon] Use the new Lang class to select the current language.\n[avsm] Added $conf['navigator'] to control the auto-refreshing navigator\n[cjh] Fixed spell checker javascript, and spell checking now only shows the spell checking form.\n[cjh] Spell checking no longer loses attachments.\n[cjh] Starting to remove all uses of call-time pass-by-reference.\n[cjh] Include the actual mime type in the munged mime type when downloading attachments.\n[jon] Turned the IMP version footer into a link to http://www.horde.org/imp/.\n[cjh] Tweak the wordwrapping in mime_view_text() a little bit.\n[cjh] Remove all references to $doc and the HTMLDocument class.\n[cjh] Use the new css.php Horde script to generate our stylesheets.\n[jon] Specifying an absolute URL for $conf['user']['alternate_login'] will redirect a new user to that URL instead of the login screen.  This is useful in portal situations in combination with remote_login.php.\n[cjh] Gracefully handle empty search results.\n[cjh] Only show the personal information (if we have it) when we show To: in the From column.\n[jon] Added $conf['user']['online_help'] toggle to disable the online help links.\n[jon] Removed the $conf['user']['change_*'] settings in favor of the \"changeable\" bit in config/prefs.php.\n[jon] Retired the newuser.php code.\n[jon] Explicitly change the permissions on uploaded attachments to 0600.\n[jon] New XML-based help subsystem.\n[cjh] Renamed package.imp.php to IMP.php.\n[cjh] Made folder navigator work with cookies disabled.\n[avsm] New option to inline CSS; toggled by $conf['layout']['css_inline']\n[jon] Add mouseover status text for the menu items.\n[cjh] Center the IMP version footer and make it more readable in color.\n[cjh] Work on the look and stylesheet conversion of the compose screen.\n[jon] Updated the copyright information in the header comments.\n[jon] Renamed config/{header,trailer}.txt to config/{header,trailer}.txt.dist in the distribution.\n[jon] Force a leading plus sign on the GMT offset part of the rfcdate.\n[jon] Enlarged the default size of the compose window.\n[jon] Set the default cursor focus in the compose screen depending on the action.\n[jon] Renamed $conf['msg']['append_footer'] to $conf['msg']['append_trailer'].\n[jon] New configuration directive: $conf['sitename']\n[jon] Renamed generic-{header,footer}.inc to common-{header,footer}.inc.\n[jon] Preferences that aren't user-changeable are now disabled (only works under Internet Explorer).\n[jon] Use Chris Russel's wordwrap function, if it exists.\n[jon] Rewrote and cleaned-up a lot of the menu.php code.  Improved the usage comments in config/menu.txt.\n[jon] If the user does not have Javascript capabilities, a submit button will be displayed next to the folder listing in the menu.\n[jon] For improved code clarity, renamed $conf['server']['personal_folders'] to $conf['server']['namespace'].\n[avsm] Updated the navigator to fit into the new frameless layout\n[jon] Display the IMP version string in the footer.\n[jon] Converted all of the pages to the new frameless layout.\n[jon] IMP now uses the gettext functions exclusively.\n[cjh] Wrap long lines in messages using str_replace. Should be efficient.\n[cjh] Changed view.php to use an array for the cached mime info instead of an object, to match Horde change.\n[jon] Discontinued the use of the $_html['compose*'] sizing parameters.\n[jon] Setting $conf['user']['select_sentmail_folder'] to true will allow the user to choose the folder into which they'd like to save a copy of their current message.\n[jon] Renaming the \"Expunge\" action to \"Purge Deleted\".\n[jon] Saving sent mail is settable on a per-composition basis.  The default setting is based on the user's current preference ('save_sent_mail').\n[cjh] Fixed errors when postponing a message without attachments.\n[jon] Upgraded the doctype to XHTML 1.0 Transitional.\n[jon] Renamed the IMAPServer class to MailServer.  Also renamed the $IMAPServers hash in config/servers.php to $servers.\n[cjh] Lots of new icons!\n[cjh] Fix the problem with mailboxes seeming to only have 1000 messages in the message view.\n[cjh] Fix the preferences system to be a bit more consistent, and to still allow use of config/servers.php\n[jon] A newer, better preference system implementation.  This uses the new Prefs classes from Horde 1.3.\n"
2.3.5:
  notes: "[cjh] Pass attachment types that have been marked viewable on to the browser untouched if there isn't a custom view function defined.\n[cjh] Fix bug deleting the most recently selected folder.\n[cjh] Don't require a message body before sending a message.\n[avsm] Added a simple text toolbar to the top of the navigator view.\n[cjh] Use the &singleton() pattern to make sure we only create one $log instance.\n[jon] Make use of Horde's Log abstraction interface.\n[cjh] handle \"Lastname, Firstname\" style addresses correctly when replying.\n[cjh] Use login.inc in both login.php and remote_login.php\n[jon] The compose window's date format is now configurable.\n[jon] The text for intro.php is now inlined using gettext().\n[cjh] Kludge to fix the deletion of messages over pop3.\n[cjh] Use a different icon to denote multipart/alternative messages.\n[cjh] Make the from_link to view messages consistent with the subject link to view messages.\n[cjh] Don't enable the mswordview mimetype if $conf['utils']['mswordview'] is empty, false, or unset.\n[cjh] Add an option to log sending of mail, from Samuel D. Nicolary <sdn@isc.upenn.edu>\n[avsm] Added code to update message info in navigator.php.\n[jon] The time and date formats for the mailbox listing are now configurable.\n[cjh] Do some handling of badly-typed addresses (seperated by spaces, etc).\n[jon] Removed the Contacts links from the compose window.\n[jon] The configuration toggle $conf['user']['allow_ldap_search'] has been renamed $conf['user']['allow_directory_search'] to reflect the abstract nature of Turba's search capabilities.\n[jon] Removed the folder-replying capabilities.\n[jon] Removed IMP's contacts code. We'll use Turba's from now on.\n[cjh] Use the new horde_cleanup() function to make sure that files generated by viewing mime parts will always be cleaned up at the end of the request, no matter how the request is terminated.\n[cjh] Remove phplib dependancy in favor of php4 sessions/PEAR.\n[jon] Added a \"Print\" action to the message view.\n[cjh] Replace use with require_once since use isn't supported for php4.\n[cjh] All $h->*address references are gone, and we have two new functions in package.imp.php - IMP::addrObject2String() and IMP::addrArray2String() - to make working with the $h->from[], etc arrays easier.\n[cjh] Selecting a language on the login screen now actually has an effect\n[jon] Setting $conf['user']['initial_subscribe'] will automatically subscribe all of the folders in the user's folder path at the end of the newuser welcome process. Note that this also requires $conf['user']['newuser_setup'] to be true.\n[jon] Set the umask ($conf['umask']) globally in package.imp.php.\n[jon] The \"cancel message\" confirmation now cancel's the message if the user chooses \"Ok\" instead of \"cancel\" in the alert box.\n"
2.3.4:
  notes: "[cjh] The mailbox selects in the mailbox and message views now update in tandem (ie, if you change one, the other updates to the same selection).\n[cjh] The login screen does not reload when you choose a new language, if a username or password has been entered.\n[cjh] Changing the protocol selected changes the port to the default port for that protocol.\n[jon] Got rid of those nasty '---------'s in the folder selects and replaced them with blank spaces instead.\n[cjh] Message flags are now displayed in the message.php screen.\n[cjh] There is now a menu to change the flags of messages.\n[cjh] Signed/Encrypted messages are shown with a different icon than other messages with attachments.\n[cjh] Mailbox sorting works again (impSetupSession wasn't calling _setPref).\n[cjh] Folder subscriptions are correctly kept up to date on folder renaming.\n[cjh] Once again you are asked to confirm before deleting folders\n[cjh] The menu now properly refreshes on ALL folder changes. =)\n[jon] The menu now properly refreshes on folder subscription changes.\n[cjh] If an attachment is not set to disposition: inline, don't display it inline regardless of other settings. (text_parts_inline, type, etc).\n[jon] The To: address is now listed in the window.status on mouse over.\n[cjh] Addresses are now listed individually in the message screen, with a compose link and \"add to contacts\" link for each.\n[cjh] Added $conf['hooks']['from_hook'] which implements building a from address based on a site-specific function. Yes, the implication is that there might be more \"hooks\" in the future.\n[cjh] Added $conf['compose']['allow_(b)cc'] to control the availability of the cc: and bcc: fields.\n[cjh] Added javascript to the message screen to make sure that a folder is selected before moving/copying a message\n[jon] All generated URL's are now relative (URI's only), except for the Location: headers used for redirection.  They require fully-qualified URL's.\n[cjh] If mailfrom() returns false, compose.php3 now at least tells the user there was an error instead of silently reloading.\n[jon] Improved the entire newuser login procedure so that we correctly initialize their preferences with all of the default values.\n[jon] Added checks for null preference results that would previously cause a a plethora of warnings and errors.\n[cjh] Added a $conf['server']['show_shared_hierarchy'] option to display the UW-imapd #shared/ folder hierarchy.\n[cjh] POP3 support should now be fully functional for 2.3.\n[cjh] Added $conf['user']['redirect_on_logout'] as an option for sending users to an arbitrary page when they log out.\n[cjh] Fixed a problem with IE caching the bounce form.\n[cjh] The attachment icon for messages with attachments is back in the mailbox view (in it's own new column).\n[cjh] Started weeding out unneccesary uses of imap_msgno() when the function in question takes the FT_UID flag.\n[cjh] Vastly improved the MIME attachment code. IMP now passes the MIME torture test.\n[cjh] Fixed a javascript problem in the compose window where the last character before a space would be deleted incorrectly.\n[cjh] Doctored the clickable-url functions for performance, and to not butcher included html code.\n[cjh] Replaced all calls to ereg* functions with preg* functions, for speed. Because of this we now require php 3.0.12 or later.\n"
2.3.2:
  notes: "BUG: submitting a non-existant file as an attachment is now safely ignored (cjh)\nBUG: the message select popup in the mailbox view works again now. IE doesn't let you use \"type\" as a form element name. (cjh)\nBUG: encoding of 8-bit headers should now be _very_ close to following the RFC, if it doesn't completely. long headers are split up into atoms smaller than 76 chars (cjh)\nCHANGE: using YYYY-MM-DD for dates in mailbox.php3 for days other than today (cjh)\nCHANGE: multiple folders can now be deleted at once (jon)\nCHANGE: cancelling a message now waits for the user to confirm (cjh)\nCHANGE: new user preferences screen with more options (jon)\nCHANGE: retired the $default object (in favor of $conf) from IMP (jon)\nCHANGE: newuser.php3 has been renamed intro.php3 (jon)\nCHANGE: improved the unsubscribed folder listing a bit (jon)\nLANGUAGE: updated Italian translation from Federico Giannici <giannici@neomedia.it>\nENHANCEMENT: adding patches from Michael Smith <michael@csuite.ns.ca> to save some information on failed logins (username, etc)\nENHANCEMENT: IMP no longer requires cookies to be enabled on the client (jon)\nENHANCEMENT: added $conf['use_ssl'] to force 'https://' in generated URL's (jon)\nENHANCEMENT: if locale/local/intro.{begin,main,end}.txt exists, it will be\nused in place of the locale/$language/ version (jon)\nENHANCEMENT: added the ability to hide the server list, providing nice transparency for virtual hosting.\nENHANCEMENT: added ability to generate From: addresses like <user+folder> (jon)\nENHANCEMENT: new user setup screen for initial prefs configuration (jon)\nENHANCEMENT: preferences support both ldap and sql storage sources (jon)\n"
2.3.1:
  notes: "NEW: Debian Package mime viewing (iem)\nNEW: x-tar mime viewing (iem)\nNEW: GPG signature checking (iem)\nFIXED: tgz mime viewing (iem)\nUPDATE: new pine2imp.pl script from murley@murley.com\nCHANGE: Removed config/defaults.php3 and replaced it with config/conf.php (jon)\nCHANGE: Reworked the way some of the contacts popup works (jon)\nCHANGE: User-Agent: 'IMP PHP/IMAP webmail program' > 'IMP webmail program' (jon)\nCHANGE: Added the \"signature dashes\" user preference (jon)\nCHANGE: New preferences system implemented (jon)\nCHANGE: Removed all help from the login screen (jon)\nCHANGE: The \"New User Introduction\" link is no longer optional (jon)\nCHANGE: $default->localhost is deprecated in favor of $SERVER_NAME\nCHANGE: INBOX is no longer shown on the folders page\nLANGUAGE: Czech updated\nLANGUAGE: German updated\nLANGUAGE: French updated\nENANCEMENT: Rebuilt the preferences sub-system (see config/prefs.php) (jon)\n"
2.3.0:
  notes: "CHANGE: Changed all of the SQL scripts to use \"horde\" db instead of \"imp\" (jch)\nCHANGE: Fixed German translation bugs in the newuser start file (jch)\nCHANGE: All locale/ strings default to English ('en') now.  If another language is selected, it will be loaded on top of the English strings.  This should solve the problem of some localizations missing a string here and there. (jon)\nCHANGE: The top and bottom mailbox listing navbars are now symmetrical (jon)\nCHANGE: removed deprecated Errors-To: header (cjh)\nCHANGE: Changed X-Mailer to User-Agent (ref: draft-ietf-usefor-article-02) (jon)\nCHANGE: Removed some more unused files and cleaned up build scripts accordingly. (cjh)\nCHANGE: Moved config/README to doc/CONFIGS\nCHANGE: Removed old config/scripts/*.txt files in leiu of doc/DATABASE\nCHANGE: Went back to $h->udate for message dates (cjh)\nBUG: 8bit headers should now be properly encoded (Roy-Magne Mo & cjh)\nBUG: Poppassd should work now (\"Charles P. Wright\" <cpwright@cpwright.com>)\nBUG: LDAP searches can now be against fields other than 'cn'\nBUG: Fixed the folders screen and some mailbox listing code\nBUG: Changing languages now refreshes login screen under Internet Explorer\nBUG: Fixed small bug with $to_domain and empty address strings (jon)\nBUG: Misinterpretted result from imp_get_lang() fixed <rmo@www.hivolda.no>\nBUG: Mime-encoded headers are now handled much more consistently. There *shouldn't* be issues with these left. Please report any you find.\nBUG: Quoted printable messages are now decoded when being forwarded and replied to.\nBUG: Fixed French and Brazilian Portuguese language problems\nBUG: Fixed a bug when forwarding without a from address <alan@halachmi.net>\nBUG: Fixed a bug opening contacts window on compose page\nBUG: Fixed violation of the spec for URL when downloading files with name spaces\nBUG: Fixed a misidentification of Microsoft web browsers\nBUG: Fixed a missing </TABLE> tag breaking menu positioning\nBUG: Bouncing a message doesn't ruin attachments anymore\nBUG: Correctly handles missing subject when you forward mail\nBUG: Fixed Nynorks-Norwegian language (Roy-Magne Mo<rmo@www.hivolda.no>)\nBUG: Fixed cosmetic counting problem when deleting messages\nENHANCEMENT: now prints a messages when the mailbox is empty (jon)\nENHANCEMENT: sets the html charset according to the language selection (jon)\nENHANCEMENT: added support for cascading stylesheets (jon)\nENHANCEMENT: fix for extremely long folder names in select.php3 (jon)\nENHANCEMENT: added the option to hide deleted messages from mailbox listing (jon)\nENHANCEMENT: syslog stats courtesy of Michael Smith <michael@csuite.ns.ca>\nENHANCEMENT: Forwarding a message with attachments sends the attachments along, and you can also delete parts if you wish.\nENHANCEMENT: Unknown browsers are simply asked to send info; IMP assumes that they work\nENHANCEMENT: Multiple compose windows are now supported\nENHANCEMENT: Added a simple cron.daily file that will clean up stranded attachments\nENHANCEMENT: Changed setup's defaults to be more for internal-use sites\nENHANCEMENT: Sybase support has been added to IMP <slack@cc.utah.edu>\nENHANCEMENT: new $default->to_domain tacked onto bare compose addresses\nENHANCEMENT: Login language pull-down can now be disabled (jon)\nENHANCEMENT: Debian package build scripts included\nENHANCEMENT: Sent-mail now marked as read (\\\\Seen)\nENHANCEMENT: New Danish locales\nLANGUAGE: Norwegian language support - Hans Morten Kind <Kind@it.uib.no>\nLANGUAGE: Estonian language support (Jaanus Toomsalu <jaanus@matti.ee>\nLANGUAGE: Finnish language support (leo.jaaskelainen@kolumbus.fi)\nLANGUAGE: Czech language support Peter Cech <cech@atrey.karlin.mff.cuni.cz>\nLANGUAGE: Polish language support -_ sergio _- <ser@serek.arch.pwr.wroc.pl>\nLANGUAGE: Norwegian Bokmål language support - Terje Lunndal <terje.lunndal@norway.eu.net>\nLANGUAGE: Icelandic language support - Kristofer Arnar Einarsson <kristofe@kristofer.com>\nLANGUAGE: French updated - Jean Charles Delepine <delepine@u-picardie.fr>\nSECURITY: We should now be immune to the {} and mocha javascript exploits recently described on Bugtraq - Charles Wright.\n"
2.1.2:
  notes: "cjh: whomp. here we go.\nBiggest change: session support through dbm files. YOU MUST touch the dbm\nfile (by default imp/lib/sessions) and give the webserver user read/write\npermissions to it (actually, you don't have to create it if the webserver\nhas write access to the lib/ directory).\nI've tested this will everything I can think of - server list, languages,\nevery page, etc. I think it works. I probably missed something. So please,\npound on it, fix it, make suggestions.\nAlso: I've taken a lot of cruft that wasn't being used out. imp.lib was\nunder 1000 lines for the first time in a while after this! I may prune more\nv2 stuff if it's not used soon; that would trim us even more. I didn't trim\na whole lot from horde.\nCosmetic: the 'check inbox' option on the menu is gone (should probably\nremove the lang strings - haven't done that) and it's replaced with a cute\nlittle reload graphic at the top left of mailbox pages that lets you refresh\nany mailbox that you're in. this is more consistent from a ui point of view.\nEverything else: reformatting, minor changes/fixes/etc. Nothing noteworthy\nenough to remember off of the top of my head.\nTo do: dump the mailbox_list functions into the new ImapSession object, or\n*at least* rewrite them to take advantage of the new namespace objects that\nare available. I haven't touched this one yet.\nComments?\n"
2.1.1:
  notes: "Enhancements:\n* Imp now undestands French (thanks to Mathieu Clabaut <clabault@multimania.com>)\n* Attachments are now indicated with a paperclip in the regular status column\n* New mail for each folder is listed in folder listing\n* You can configure the \"from\" server on a per-server basis w/servers.php3 now\n* Imp has help links in the contacts window\nBug Fixes:\n* Fixed a bug in the contacts that was causing Javascript errors\n* Fixed bug in forward mail case with mail that was missing headers\n* Fixed a bug where replying to mail caused errors and warnings\n"
2.0.3:
  notes: "There were a bunch of changes, but nobody updated this file\n"
2.0.1:
  notes: "Several pieces of IMP have been moved into the Horde module.  They include the\nsignup feature, problem reporting, the help functions, and faq management.\n\nA new motd feature has been added.  You can now use the file called MOTD.html\nand put in information you want shown under the login screen.  This file sits\nin the config directory.\n\nExtendable menus.  You can now easily add menu items by adding items to the\nmenu.txt file which resides in the config directory.\n\nYou can now set your session language at login.\n\nA \"new-user information\" piece has been added to the login screen.  This\nfunction provides new users with some basic background on using IMP.\n\nA function was added to the compose window which does not allow you to send\na piece of email if you have browsed a file attachment but haven't attached\nit yet.\n\nHelp items were added to the compose window.\n\nFixed several issues with multiple read/write imap openings. Now only\ncalls that require read/write use read/write.\n\nFixed multiple append trailer/footer bugs.\n\nLocalized the setup.php3 process.\n\nUpdated lynx pages so lynx works again with IMP\n\n\n"
0.0.1:
  notes: "Original version string was extra0.0.1\n[mms] SECURITY: XSS - Make sure mailbox name displayed on mailbox page is\n[mms] Use IMAP_Tree."
