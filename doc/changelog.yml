    uri: http://www.horde.org/licenses/gpl
  notes: "[mms] Ensure that search/POP3 mailbox listings are saved even if there is an issue with the underlying cache backend.\n[mms] Fix replying to non-UTF-8 messages when the 'reply_charset' preference is true.\n[jan] Fix vCard MIME viewer.\n[jan] Fix MIME viewer form actions in basic view (Bug #12677).\n[mms] Don't store/retrieve message history data if the Message-ID is missing/invalid.\n[mms] Fix resuming draft from mailbox page in basic view.\n[mms] Fix displaying Virtual Trash mailbox (Bug #13418).\n[mms] Fix menu actions on the minimal message page (Bug #13440).\n[jan] Fix switching to HTML editor in basic mode if signature display is not active.\n[mms] Fix expiring session cached mailbox data when mailbox information changes.\n[mms] Fix updating viewport immediately after deleting messages on POP3 servers.\n"
6.2.1:
  api: 6.2.0
  state:
    release: stable
