    uri: http://www.horde.org/licenses/gpl
  notes: "[jan] Don't attempt to delete linked attachments monthly if they have been disabled (Bug #10166).\n[jan] Don't show basic headers twice when showing all headers (Bug #10276).\n[jan] Add IMP_Contents#getTree() to return a tree representation of a message's MIME parts.\n[mms] Fix regression in parsing list reply address (Bug #10258).\n[jan] Tick sent-mail checkbox off when selecting sent-mail folder in dynamic view.\n[jan] Keep key navigation active after clicking into a HTML message (Request #9720).\n[mms] Fix additional regression when flagging all messages in a mailbox (Bug #10243).\n[mms] Fix \"Don't Show\" filtering in traditional mailbox view (Bug #10244).\n"
5.0.7:
